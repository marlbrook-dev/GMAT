function startMock(section){ if(!planGate('mock')) return; const meta=SECTION_META[section]; const qs=pickMockSection(BANK,state,section); if(!qs.length){toast('No '+meta.name+' items available.');return;}
 if(qs.length<meta.questions) toast('Bank has '+qs.length+' usable items; running a '+qs.length+'-question section.');
 session={id:'m'+Date.now(),mode:'mock',section,qs,i:0,answers:qs.map(()=>null),marks:qs.map(()=>false),secsArr:qs.map(()=>0),results:[],start:Date.now(),deadline:Date.now()+45*60000,editsLeft:3,phase:'run'};

function mockTick(){ const t=document.getElementById('timer'); if(!t||!session||session.mode!=='mock') return; const left=Math.max(0,session.deadline-Date.now()); t.textContent=fmtSecs(left/1000); t.classList.toggle('over',left<5*60000);
 if(left<=0){ clearInterval(qTimer); if(session.phase!=='done'){ mockBankTime(); toast('Time. Scoring what you answered.'); mockFinish(); } } }
function mockBankTime(){ if(session.qStart){ session.secsArr[session.i]+=(Date.now()-session.qStart)/1000; session.qStart=null; } }
function currentAnswer(q){ if(q.answerType==='tpa') return (session.tpa[0]===null||session.tpa[1]===null)?null:session.tpa.slice();
 if(q.answerType==='gi') return session.gi.some(v=>v<0)?null:session.gi.slice();
 if(q.answerType==='ta') return session.ta.some(v=>v===null)?null:session.ta.slice();
 return session.choice===null?null:session.choice; }
function applySavedAnswer(q,a){ if(a==null) return;
 if(q.answerType==='tpa'){ session.tpa=a.slice(); document.getElementsByName('tpa0')[a[0]].checked=true; document.getElementsByName('tpa1')[a[1]].checked=true; }
 else if(q.answerType==='gi'){ session.gi=a.slice(); document.querySelectorAll('#v-study .gi-st select').forEach((s,i)=>{ s.value=String(a[i]); }); }
 else if(q.answerType==='ta'){ session.ta=a.slice(); document.querySelectorAll('#v-study table.ta tbody tr').forEach((tr,i)=>{ const r=tr.querySelectorAll('input'); if(a[i]===true) r[0].checked=true; else if(a[i]===false) r[1].checked=true; }); }
 else selectChoice(a); }
function renderMockQ(){ const el=document.getElementById('v-study'); const q=session.qs[session.i]; session.qStart=Date.now(); session.answered=false; session.choice=null; session.tpa=[null,null]; session.reason=null; session.guessed=false;
 const wide=!!(q.passage||q.passageHtml); let left=''; if(q.passage) left='<div class="passage">'+esc(q.passage)+'</div>'; else if(q.passageHtml) left='<div>'+q.passageHtml+'</div>';
 const choicesHtml=answerInputs(q); const marked=session.marks[session.i]; const editing=session.phase==='edit';
 const top='<div class="qtop">'+badge(SEC_SHORT[q.section],'sec-'+q.section)+badge(typeLabel(q))+(editing?badge(session.editsLeft+' change'+(session.editsLeft===1?'':'s')+' left','warning'):'')+'<div class="grow">'+pbar(null,session.i/session.qs.length*100,'var(--brand-primary)',true)+'</div><span class="mono small">'+(session.i+1)+' / '+session.qs.length+'</span><span class="timer" id="timer" role="timer" aria-label="Section time remaining">45:00</span></div>';
 const nextLabel=editing?'Save answer':(session.i+1<session.qs.length?'Next question':'Review section');
 el.innerHTML='<div class="'+(wide?'':'narrow ')+'stack-4">'+top+'<div class="card p8">'+(wide?'<div class="qgrid"><div>'+left+'</div><div>':'')+'<div class="stem">'+esc(q.stem)+'</div>'+choicesHtml+(wide?'</div></div>':'')
 +'<div class="row" style="justify-content:space-between;margin-top:var(--space-6)"><span class="row">'+(editing?'<button class="btn ghost" onclick="mockBackToReview()">Back without saving</button>':'<button class="btn ghost" onclick="mockAbandon()">Abandon section</button>')+'<button class="btn secondary" id="markBtn" onclick="mockToggleMark()">'+(marked?'Bookmarked':'Bookmark')+'</button></span><button class="btn" onclick="mockNext()">'+nextLabel+'</button></div></div></div>';
 if(editing) applySavedAnswer(q,session.answers[session.i]);
 clearInterval(qTimer); qTimer=setInterval(mockTick,500); mockTick(); window.scrollTo(0,0); }
function mockToggleMark(){ session.marks[session.i]=!session.marks[session.i]; document.getElementById('markBtn').textContent=session.marks[session.i]?'Bookmarked':'Bookmark'; }
function mockAbandon(){ if(!confirm('Abandon this mock section? Nothing will be scored.')) return; clearInterval(qTimer); session=null; renderStudyHome(); }
function mockNext(){ const q=session.qs[session.i]; const a=currentAnswer(q); if(a===null){ toast('Answer to move on. The real exam does not allow skips.'); return; }
 if(session.phase==='edit'){ const before=JSON.stringify(session.answers[session.i]); if(JSON.stringify(a)!==before){ session.answers[session.i]=a; session.editsLeft--; toast('Answer changed. '+session.editsLeft+' change'+(session.editsLeft===1?'':'s')+' left.'); } mockBankTime(); session.phase='review'; renderMockReview(); return; }
 mockBankTime(); session.answers[session.i]=a;
 if(session.i+1<session.qs.length){ session.i++; renderMockQ(); } else { session.phase='review'; renderMockReview(); } }
function mockBackToReview(){ mockBankTime(); session.phase='review'; renderMockReview(); }
function mockEdit(i){ if(session.editsLeft<=0){ toast('No answer changes left.'); return; } session.phase='edit'; session.i=i; renderMockQ(); }
function renderMockReview(){ clearInterval(qTimer); qTimer=setInterval(mockTick,500);

 +'<p class="muted">Open and change up to <b>'+session.editsLeft+'</b> answer'+(session.editsLeft===1?'':'s')+' while time remains. Scoring is final.</p>'
 +'<div class="card"><table><thead><tr><th>#</th><th>Type</th><th></th><th>Status</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'
 +'<div class="row" style="justify-content:flex-end"><button class="btn" onclick="mockFinish()">Score my section</button></div></div>'; mockTick(); }
function mockFinish(){ clearInterval(qTimer); session.phase='done'; const secTotal=(Date.now()-session.start)/1000;
 session.qs.forEach((q,i)=>{ const a=session.answers[i]; const correct=a===null?false:gradeChosen(q,a); const secs=Math.max(1,Math.round(session.secsArr[i]||1)); const flag=recordAttempt(state,q,a,correct,secs,null,false,session.id); session.results.push({q,correct,secs,flag,unanswered:a===null}); Cloud.logAttempt(state.attempts[state.attempts.length-1]); });
 const n=session.results.length, c=session.results.filter(x=>x.correct).length; const avg=session.results.reduce((s,x)=>s+x.secs,0)/n;
 state.sessions.push({id:session.id,mode:'mock',ts:Date.now(),n,c,avg:Math.round(avg)}); track('round_completed',{mode:'mock',correct:c,total:n,secs:Math.round(secTotal)}); if(Cloud.user) Cloud.client.from('sessions').upsert({id:session.id,user_id:Cloud.user.id,mode:'mock',n,c,avg_secs:Math.round(avg)}).then(()=>{}); persist(); updateHeader(); renderMockReport(secTotal); }
function renderMockReport(secTotal){ const r=session.results; const n=r.length, c=r.filter(x=>x.correct).length; const meta=SECTION_META[session.section]; const sum=sectionSummary(state,session.section);
 const bySkill={}; r.forEach(x=>{ const k=x.q.skill; bySkill[k]=bySkill[k]||{n:0,c:0}; bySkill[k].n++; if(x.correct) bySkill[k].c++; });
 const skillRows=Object.keys(bySkill).map(k=>{ const s=SKILLS.find(x=>x.id===k); const b=bySkill[k]; return '<tr><td>'+s.label+'</td><td class="num">'+b.c+' / '+b.n+'</td><td class="num">'+Math.round(b.c/b.n*100)+'%</td></tr>'; }).join('');
 const slow=r.filter(x=>x.flag==='slow').length, un=r.filter(x=>x.unanswered).length; const misses=r.filter(x=>!x.correct);
 const missHtml=misses.length?'<div class="card"><div class="card-head"><span class="card-title">Missed questions ('+misses.length+')</span></div>'+misses.map(x=>'<details style="border-top:1px solid var(--border-default);padding:10px 0"><summary style="cursor:pointer;font-size:14px">'+(x.unanswered?'[unanswered] ':'')+typeLabel(x.q)+' · '+esc(x.q.stem).slice(0,90)+'...</summary><div class="small" style="padding:8px 0 2px"><b>Why:</b> '+esc(x.q.expl)+'</div></details>').join('')+'<div class="small muted" style="margin-top:8px">All misses joined your spaced review queue.</div></div>':'';
 document.getElementById('v-study').innerHTML='<div class="narrow stack"><div style="text-align:center"><div class="mono" style="font-size:56px;font-weight:500;color:var(--brand-primary)">'+c+' / '+n+'</div><h1 style="font-size:var(--text-xl);margin-top:4px">'+meta.name+' mock section</h1><p class="muted" style="margin:6px 0 0">'+fmtSecs(secTotal)+' of 45:00 · '+sum.band+(sum.meanR?' · mean rating '+sum.meanR:'')+'</p></div>'
 +'<div class="card"><div class="card-head"><span class="card-title">By skill</span></div><table><thead><tr><th>Skill</th><th class="num">Correct</th><th class="num">Accuracy</th></tr></thead><tbody>'+skillRows+'</tbody></table><div class="small muted" style="margin-top:8px">'+slow+' question'+(slow===1?'':'s')+' over 1.3x pace'+(un?' · '+un+' unanswered scored as misses':'')+'. Bands are internal estimates, not official GMAT scores.</div></div>'
 +missHtml
 +'<div class="row" style="justify-content:center"><button class="btn secondary" onclick="session=null;show(\'dash\')">Back to dashboard</button><button class="btn" onclick="startMockIntro()">Another section</button></div></div>'; }
function renderQuestion(){ const el=document.getElementById('v-study'); const q=session.qs[session.i]; session.qStart=Date.now(); session.answered=false; session.choice=null; session.tpa=[null,null]; session.reason=null; session.guessed=false;
 const allot=SECTION_META[q.section].allot; const wide=!!(q.passage||q.passageHtml);
 let left=''; if(q.passage) left='<div class="passage">'+esc(q.passage)+'</div>'; else if(q.passageHtml) left='<div>'+q.passageHtml+'</div>';
 const choicesHtml=answerInputs(q);
 const top='<div class="qtop">'+badge(SEC_SHORT[q.section],'sec-'+q.section)+badge(typeLabel(q))+badge('Level '+q.diff)+'<div class="grow">'+pbar(null,session.i/session.qs.length*100,'var(--brand-primary)',true)+'</div><span class="mono small">'+(session.i+1)+' / '+session.qs.length+'</span><span class="timer" id="timer" role="timer" aria-label="Question timer">0:00</span><span class="small mono">pace '+fmtSecs(allot)+'</span></div>';
 const body='<div class="'+(wide?'':'narrow ')+'stack-4">'+top+'<div class="card p8">'+(wide?'<div class="qgrid"><div>'+left+'</div><div>':'')+'<div class="stem">'+esc(q.stem)+'</div>'+choicesHtml+(wide?'</div></div>':'')+
  '<div id="fb"></div><div class="row" style="justify-content:space-between;margin-top:var(--space-6)"><button class="btn ghost" onclick="endSession()">Exit round</button><span id="actionBtn"><button class="btn" id="submitBtn" onclick="submitAnswer()">Submit answer</button></span></div></div></div>';
 el.innerHTML=body; clearInterval(qTimer); qTimer=setInterval(()=>{ const s=(Date.now()-session.qStart)/1000; const t=document.getElementById('timer'); if(!t) return; if(session.mode==='sprint'){ const left=allot-s; t.textContent=(left<0?'-':'')+fmtSecs(Math.abs(left)); t.classList.toggle('over',left<0); if(left<0&&!session.bailWarned){ session.bailWarned=true; toast('Bail rule: pick your best remaining choice and move on.'); } } else { t.textContent=fmtSecs(s); t.classList.toggle('over',s>allot); } },500); session.bailWarned=false;
 document.querySelectorAll('#v-study table.sortable th').forEach((th,ci)=>{ th.style.cursor='pointer'; th.title='Sort'; th.onclick=()=>sortTable(th.closest('table'),ci); }); window.scrollTo(0,0); }
function selectChoice(i){ if(session.answered) return; session.choice=i; document.querySelectorAll('.opt').forEach((l,j)=>l.classList.toggle('selected',j===i)); }
function submitAnswer(){ if(session.answered) return; const q=session.qs[session.i]; let correct, chosen;
 if(q.answerType==='tpa'&&(session.tpa[0]===null||session.tpa[1]===null)){toast('Select one value in each column.');return;}
 if(q.answerType==='gi'&&session.gi.some(v=>v<0)){toast('Complete every dropdown.');return;}
 if(q.answerType==='ta'&&session.ta.some(v=>v===null)){toast('Answer Yes or No for every statement.');return;}
 if(!q.answerType&&session.choice===null){toast('Choose an answer first.');return;}
 chosen=currentAnswer(q); correct=gradeChosen(q,chosen);
 clearInterval(qTimer); session.answered=true; const secs=(Date.now()-session.qStart)/1000; session.pending={q,chosen,correct,secs};
 if(q.answerType!=='tpa'){ document.querySelectorAll('.opt').forEach((l,j)=>{ l.disabled=true; l.classList.remove('selected'); if(j===q.answer) l.classList.add('correct'); else if(j===chosen) l.classList.add('incorrect'); }); }
 const flag=timingFlag(q.section,secs); const flagTxt=flag==='slow'?' That was over 1.3x section pace.':flag==='fast'?' That was well under pace.':'';
 const ans=q.answerType==='tpa'?q.choices[q.answer[0]]+' / '+q.choices[q.answer[1]]:q.answerType==='gi'?q.statements.map(s=>s.options[s.answer]).join(' / '):q.answerType==='ta'?q.statements.map(s=>s.answer?'Yes':'No').join(' / '):String.fromCharCode(65+q.answer);
 if(q.answerType==='gi'||q.answerType==='ta'){ document.querySelectorAll('#v-study select, #v-study input[type=radio]').forEach(x=>x.disabled=true); }
 let fb='<div class="why"><b>'+(correct?'Correct.':'Not quite. Answer: '+ans+'.')+'</b> <span class="small mono">'+fmtSecs(secs)+' vs pace '+fmtSecs(SECTION_META[q.section].allot)+'.</span><span class="small">'+flagTxt+'</span><p><b>Why:</b> '+esc(q.expl)+'</p>'+(q.wrong?'<p class="small"><b>Watch for:</b> '+esc(q.wrong)+'</p>':'')+'</div>';
 if(!correct){ fb+='<div class="reason"><div class="lbl">Why did you miss it? This drives what gets re-served.</div>'+ERROR_REASONS.map(r=>'<button onclick="setReason(this,\''+r.id+'\')">'+esc(r.label)+'</button>').join('')+'</div>'; }
 else { fb+='<div class="reason"><button onclick="this.classList.toggle(\'sel\');session.guessed=this.classList.contains(\'sel\')">I guessed or was not confident (schedule for review)</button></div>'; }
 document.getElementById('fb').innerHTML=fb; document.getElementById('actionBtn').innerHTML='<button class="btn" onclick="nextQuestion()">'+(session.i+1<session.qs.length?'Next question':'See results')+'</button>'; }

function nextQuestion(){ const p=session.pending; if(!p) return; if(!p.correct&&!session.reason){ toast('Tag a reason so the engine can learn from it.'); return; }

function endSession(){ clearInterval(qTimer); if(session.results.length) finishSession(); else { session=null; renderStudyHome(); } }
function finishSession(){ clearInterval(qTimer); const r=session.results; const n=r.length, c=r.filter(x=>x.correct).length; const avg=r.reduce((a,b)=>a+b.secs,0)/n; const total=r.reduce((a,b)=>a+b.secs,0);
 state.sessions.push({id:session.id,mode:session.mode,ts:Date.now(),n,c,avg:Math.round(avg)}); track('round_completed',{mode:session.mode,correct:c,total:n,secs:Math.round(total)}); if(Cloud.user) Cloud.client.from('sessions').upsert({id:session.id,user_id:Cloud.user.id,mode:session.mode,n,c,avg_secs:Math.round(avg)}).then(()=>{}); persist();

 html+='<div class="tiles" style="grid-template-columns:repeat(3,1fr)">'+tile('Accuracy',pctv+'%','','')+tile('Avg. pace',fmtSecs(avg),'per question','')+tile('Slow and wrong',r.filter(x=>!x.correct&&x.flag==='slow').length,'fast and wrong '+r.filter(x=>!x.correct&&x.flag==='fast').length,'')+'</div>';
 html+='<div class="card"><div class="card-head"><span class="card-title">This round</span></div><div class="stack-4" style="gap:8px">'+r.map((x,i)=>'<div class="plan-row"><span class="mono small" style="width:18px">'+(i+1)+'</span><span class="t" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:400">'+esc(x.q.stem.split('\n')[0]).slice(0,90)+'</span>'+badge(typeLabel(x.q))+badge(x.correct?'Correct':'Missed',x.correct?'success':'error')+(x.flag!=='ok'?badge(x.flag,'warning'):'')+'<span class="m">'+fmtSecs(x.secs)+'</span></div>').join('')+'</div></div>';
 html+='<div class="card"><div class="card-head"><span class="card-title">Skill ratings after this round</span></div><table><thead><tr><th>Skill</th><th class="num">Result</th><th class="num">Rating</th></tr></thead><tbody>'+Object.keys(bySkill).map(k=>{ const s=SKILLS.find(x=>x.id===k); return '<tr><td>'+s.label+'</td><td class="num">'+bySkill[k].c+'/'+bySkill[k].n+'</td><td class="num">'+state.skills[k].r+'</td></tr>'; }).join('')+'</tbody></table></div>';

const PLAYBOOK=[
 {skill:'q_rrp',sec:'Q',title:'Rates, ratios, percent',items:['Rate x Time = Distance (or Work). Build an RTD table with one row per mover; fill two cells, solve the third.','Combined work: add rates, never times. Two machines together are always faster than the faster one alone.','Percent change = (new - old)/old. Successive changes multiply: +20% then -20% is x1.2 x 0.8 = 0.96.','Ratio multiplier: if a:b = 3:4, write a = 3k, b = 4k, then use any total or difference to find k.','Mixtures: track the pure ingredient. (acid before + acid added)/(total before + total added).','Average speed = total distance / total time. Never average the speeds.']},
 {skill:'q_vof',sec:'Q',title:'Value, order, factors',items:['Prime factorize first. Divisor count = product of (exponent + 1).','LCM takes the highest power of each prime; GCF takes the lowest. LCM x GCF = product of the two numbers.','Remainder cycles: reduce the base mod n, then find the cycle of powers.','If n^2 is divisible by p^k, n needs p^(ceil(k/2)).','Comparing fractions and decimals: convert everything to decimals to 3 places, or cross-multiply pairs.','Consecutive integers: the average equals the middle term (or the average of the two middle terms).']},
 {skill:'q_alg',sec:'Q',title:'Equalities, inequalities, algebra',items:['Word problems: define variables in words first ("a = number of adult tickets"), translate one sentence at a time, then solve.','"3 more than twice x" = 2x + 3. "Twice (3 more than x)" = 2(x + 3). Word order matters.','Inequalities flip when multiplying or dividing by a negative. Never multiply by a variable of unknown sign.','|expr| < k means -k < expr < k. |expr| > k means expr > k or expr < -k.','Discriminant b^2 - 4ac: zero means one solution, positive two, negative none.','Back-solve from the middle answer choice when the algebra looks messy; plug in numbers when answers contain variables.','Age problems: anchor every phrase to "now" before writing the equation.']},
 {skill:'q_csp',sec:'Q',title:'Counting, sets, series, probability, statistics',items:['Order matters: permutations (slots). Order does not matter: combinations (divide by k!).','"Must sit together": glue them into one unit, arrange units, multiply by internal arrangements.','Probability without replacement: multiply the changing fractions. "At least one" = 1 - P(none).','Two-set overlap: Total = A + B - Both + Neither. Subtract "neither" first.','Averages: always convert to sums. Sum = average x count.','Arithmetic sequence sum = n x (first + last)/2.','Mean vs median: median resists outliers; a skewed set has its mean pulled toward the tail.']},
 {skill:'v_ac',sec:'V',title:'Analysis and critique (critical reasoning)',items:['Find the conclusion first (after "therefore", "thus", "clearly"). Then the evidence. The gap between them is where every question lives.','Assumption: negate the choice; if the argument collapses, that is the assumption.','Strengthen / weaken: attack or defend the gap, not the evidence. Alternative causes, unrepresentative samples, and shifted terms are the big three.','Correlation-to-cause arguments: weaken with reverse causation, third factor, or coincidence.','Evaluate: the right answer is a question whose two possible answers pull the conclusion in opposite directions.','Paradox: the answer makes both facts true at once; never pick something that denies a fact.','Boldface: label each sentence as conclusion, premise, opposing view, or background before reading choices.','Predict the answer before reading the choices. Extreme words ("all", "never", "only") are usually wrong on assumption questions.']},
 {skill:'v_pc',sec:'V',title:'Plan and construct',items:['Identify the goal and the mechanism separately. A plan fails when the mechanism does not lead to the goal, or when people respond in a way that defeats it.','"Most seriously calls into question the plan": look for unintended responses (displacement, substitution, gaming).','"Required for the prediction": often a quantitative threshold hidden in the numbers.','Answers about cost, popularity, or other plans rarely bear on whether this plan works.']},
 {skill:'v_inf',sec:'V',title:'Identify inferred idea',items:['An inference must be true given the text, not merely likely. Prefer the modest answer over the interesting one.','For "complete the argument", the blank is a conclusion the facts already force; not a recommendation.','RC inference: locate the lines, then ask "what follows if this is true?" Reject anything requiring outside knowledge.','Extreme language ("never", "always", "no role") is a red flag unless the passage is equally extreme.']},
 {skill:'v_st',sec:'V',title:'Identify stated idea (RC detail and main idea)',items:['Map the passage: one phrase per paragraph stating its job (raises view, rejects it, offers alternative, addresses objection).','Main idea = the whole map, not the most interesting paragraph. Eliminate answers that are too narrow or misstate the author\'s stance.','Detail questions: find the exact lines and match meaning, not wording. Correct answers paraphrase; traps reuse words.','Function questions ("in order to"): describe the role in the argument, not the content.','Budget: 3 to 4 minutes reading, then about 1 minute per question. Read for structure, not memory.']},
 {skill:'di_ds',sec:'DI',title:'Data sufficiency',items:['Rephrase the question before touching the statements. "Is x > 5?" with x^2 in play means think about negatives.','AD / BCE grid: test (1) alone. If sufficient, answer is A or D; if not, B, C, or E. Then test (2) alone. Only combine if both fail alone.','Never solve completely. Ask only: does this pin down one value (or one yes/no)?','Two equations may be the same line (E). Check independence.','Use the stem\'s constraints (positive, integer) inside each statement.','Value questions: "sufficient" means exactly one value. Yes/no questions: a definite NO is also sufficient.']},
 {skill:'di_gt',sec:'DI',title:'Graphs and tables',items:['Read titles, axes, units, and footnotes before the question. Most misses are unit misses (thousands vs units, percent vs points).','Percent change vs absolute change: the largest bar is not the largest percent.','Sort mentally for medians; compute means only when asked.','Estimate first; choices are usually spread enough that rough arithmetic suffices. Use the calculator only for the final step.']},
 {skill:'di_msr',sec:'DI',title:'Multi-source reasoning',items:['Skim each tab for what it contains (rules vs data vs narrative). Do not read everything up front.','Answer-driven reading: go back to the tab that holds the relevant rule and check each condition in order.','List conditions as a checklist and test each request against all of them; the trap is stopping at the first satisfied rule.']},
 {skill:'di_tpa',sec:'DI',title:'Two-part analysis',items:['Decide if the two parts are independent or linked. Linked parts are one system of equations; solve once, place both answers.','The same value may be correct for both columns; do not assume they must differ.','Confirm both selections against the stem before submitting; a half-right TPA scores zero.']},
 {skill:'pacing',sec:'G',title:'Pacing and review-and-edit',items:['Section pace: Quant 2:08 per question, Verbal 1:57, DI 2:15. Check the clock every 5 questions.','Bail rule: if you have no method after 60 to 75 seconds, choose the best remaining option and bookmark it.','Focus Edition lets you bookmark and change up to 3 answers per section. Reserve 3 to 5 minutes at the end for that pass; do not re-solve from scratch.','Your Dec 2025 pattern: 5 of 6 Quant misses were slow-and-wrong. Time cost more than concepts on those. Practice letting go.']}

function renderOnboarding(){ let w=document.getElementById('onb'); if(!w){ w=document.createElement('div'); w.id='onb'; document.body.appendChild(w); } const steps=['Exam','Goal','Time','Tools']; let body='';
 if(ob.step===0) body='<h2>Which exam are you preparing for?</h2><p class="muted">Every later surface (sections, score model, rounds) keys off this choice.</p><div class="chips" style="gap:10px">'+OB_EXAMS.map(e=>'<span class="chip-t '+(ob.exam===e[0]?'on':'')+'" style="padding:9px 18px;font-size:14px;'+(e[2]?'':'opacity:.5;cursor:not-allowed')+'" '+(e[2]?'onclick="ob.exam=\''+e[0]+'\';renderOnboarding()"':'')+'>'+e[0]+' <span class="small" style="'+(ob.exam===e[0]?'color:#cdd5e3':'')+'">'+e[1]+'</span></span>').join('')+'</div>';
 if(ob.step===1) body='<h2>What are you aiming for?</h2><p class="muted">One line. It shows on your dashboard and shapes the plan.</p><input type="text" id="obGoal" style="width:100%;font-size:16px;padding:10px 12px" placeholder="e.g. Score 675+ for M7 programs" value="'+esc(ob.goal)+'" oninput="ob.goal=this.value"><div class="small" style="margin:12px 0 6px;font-weight:600">Suggestions from students with similar goals</div><div class="chips">'+OB_GOALS.map(g=>'<span class="chip-t" onclick="ob.goal=\''+g.replace(/'/g,'')+'\';renderOnboarding()">'+g+'</span>').join('')+'</div>';
 if(ob.step===2) body='<h2>How much time can you give it?</h2><p class="muted">We size the daily plan to fit.</p><div class="chips" style="gap:10px">'+['1 to 3 hrs / week','3 to 5 hrs / week','5 to 10 hrs / week','10+ hrs / week'].map(h=>'<span class="chip-t '+(ob.hours===h?'on':'')+'" style="padding:9px 18px;font-size:14px" onclick="ob.hours=\''+h+'\';renderOnboarding()">'+h+'</span>').join('')+'</div>';
 if(ob.step===3) body='<h2>Recommended tools</h2><p class="muted">Pre-selected for '+esc(ob.exam)+'. Toggle anything.</p><div class="stack-4" style="gap:10px">'+[['Quick 10','Adaptive daily rounds, the core loop'],['Timed sprint','Pace training at section speed'],['Flashcards','Formula and method recall'],['Custom drill','Targeted sets by skill and difficulty']].map(t=>'<label class="plan-row" style="cursor:pointer"><input type="checkbox" '+(ob.tools[t[0]]?'checked':'')+' onchange="ob.tools[\''+t[0]+'\']=this.checked"><span class="t">'+t[0]+'</span><span class="small">'+t[1]+'</span></label>').join('')+'</div>';
 w.innerHTML='<div class="onb-scrim"><div class="onb-card"><div class="row" style="justify-content:space-between;margin-bottom:18px"><span class="wordmark" style="font-size:17px"><svg viewBox="0 0 48 48" width="24" height="24" aria-hidden="true"><rect width="48" height="48" rx="12" fill="#122B4E"/><path d="M13 33 22 22l6 5 8.5-10" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M29.5 16.5H37V24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Start From Nowhere</span><button class="btn ghost sm" onclick="finishOnboarding(true)">Skip to dashboard</button></div><div class="row" style="gap:6px;margin-bottom:22px">'+steps.map((s,i)=>'<span class="badge '+(i===ob.step?'accent':i<ob.step?'success':'')+'">'+(i+1)+' '+s+'</span>').join('')+'</div>'+body+'<div class="row" style="justify-content:space-between;margin-top:26px"><button class="btn secondary" '+(ob.step===0?'disabled':'')+' onclick="ob.step--;renderOnboarding()">Back</button><button class="btn" onclick="'+(ob.step<3?'ob.step++;renderOnboarding()':'finishOnboarding(false)')+'">'+(ob.step<3?'Continue':'Start studying')+'</button></div></div></div>'; }
function finishOnboarding(skipped){ if(!skipped){ state.settings.program={exam:ob.exam,goal:ob.goal,hours:ob.hours,tools:ob.tools}; track('wizard_completed',{exam:ob.exam,goal_len:ob.goal.length,hours:ob.hours}); } state.settings.onboarded=true; persist(); const w=document.getElementById('onb'); if(w) w.remove(); renderDash(); }
// ---------- boot ----------
updateHeader(); renderDash(); Cloud.init(); if(!state.settings.onboarded&&state.attempts.length===0) startOnboarding();
</script></body></html>
