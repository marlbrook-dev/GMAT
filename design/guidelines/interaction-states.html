<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:20px;display:flex;align-items:center;min-height:110px;box-sizing:border-box}</style></head><body><div style="display:flex;gap:20px;align-items:center"><div style="text-align:center"><button style="font-family:var(--font-display);font-weight:700;font-size:15px;color:#fff;background:var(--brand-primary);border:none;border-radius:8px;padding:10px 20px;">Start round</button><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:8px">Default</div></div><div style="text-align:center"><button style="font-family:var(--font-display);font-weight:700;font-size:15px;color:#fff;background:var(--brand-primary);border:none;border-radius:8px;padding:10px 20px;background:var(--brand-primary-hover)">Start round</button><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:8px">Hover</div></div><div style="text-align:center"><button style="font-family:var(--font-display);font-weight:700;font-size:15px;color:#fff;background:var(--brand-primary);border:none;border-radius:8px;padding:10px 20px;background:var(--navy-950);transform:scale(.97)">Start round</button><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:8px">Pressed</div></div><div style="text-align:center"><button style="font-family:var(--font-display);font-weight:700;font-size:15px;color:#fff;background:var(--brand-primary);border:none;border-radius:8px;padding:10px 20px;box-shadow:var(--focus-ring)">Start round</button><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:8px">Focus</div></div></div></body></html>
