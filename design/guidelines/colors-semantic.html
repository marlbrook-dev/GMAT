<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:20px;display:flex;align-items:center;min-height:110px;box-sizing:border-box}</style></head><body><div style="display:flex;gap:12px;width:100%"><div style="flex:1"><div style="height:56px;border-radius:8px;background:var(--status-success);border:1px solid rgba(0,0,0,.06)"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:6px">success</div></div><div style="flex:1"><div style="height:56px;border-radius:8px;background:var(--status-success-bg);border:1px solid rgba(0,0,0,.06)"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:6px">success-bg</div></div><div style="flex:1"><div style="height:56px;border-radius:8px;background:var(--status-error);border:1px solid rgba(0,0,0,.06)"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:6px">error</div></div><div style="flex:1"><div style="height:56px;border-radius:8px;background:var(--status-error-bg);border:1px solid rgba(0,0,0,.06)"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:6px">error-bg</div></div><div style="flex:1"><div style="height:56px;border-radius:8px;background:var(--status-warning);border:1px solid rgba(0,0,0,.06)"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:6px">warning</div></div><div style="flex:1"><div style="height:56px;border-radius:8px;background:var(--status-warning-bg);border:1px solid rgba(0,0,0,.06)"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:6px">warning-bg</div></div><div style="flex:1"><div style="height:56px;border-radius:8px;background:var(--status-info);border:1px solid rgba(0,0,0,.06)"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:6px">info</div></div><div style="flex:1"><div style="height:56px;border-radius:8px;background:var(--status-info-bg);border:1px solid rgba(0,0,0,.06)"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:6px">info-bg</div></div></div></body></html>
