<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:20px;display:flex;align-items:center;min-height:110px;box-sizing:border-box}</style></head><body><div style="display:flex;gap:16px;width:100%">
<div style="flex:1;display:flex;align-items:center;gap:10px;background:var(--section-quant-bg);border:1px solid var(--section-quant-border);border-radius:8px;padding:14px 16px"><span style="width:12px;height:12px;border-radius:3px;background:var(--section-quant)"></span><span style="font-family:var(--font-display);font-weight:700;color:var(--section-quant)">Quantitative</span></div>
<div style="flex:1;display:flex;align-items:center;gap:10px;background:var(--section-verbal-bg);border:1px solid var(--section-verbal-border);border-radius:8px;padding:14px 16px"><span style="width:12px;height:12px;border-radius:3px;background:var(--section-verbal)"></span><span style="font-family:var(--font-display);font-weight:700;color:var(--section-verbal)">Verbal</span></div>
<div style="flex:1;display:flex;align-items:center;gap:10px;background:var(--section-data-bg);border:1px solid var(--section-data-border);border-radius:8px;padding:14px 16px"><span style="width:12px;height:12px;border-radius:3px;background:var(--section-data)"></span><span style="font-family:var(--font-display);font-weight:700;color:var(--section-data)">Data Insights</span></div>
</div></body></html>
