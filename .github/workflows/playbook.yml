name: Playbook

# The playbook rebuilds itself from the ledger on every merge, so the document can never
# drift from the ledger. Nothing keeps the LEDGER in step with reality, and that is the
# gap this fills: a session fixes three bugs, writes them up in a commit message, and
# forgets to append the records. The book then reports its count with total confidence
# while the repository has seen more, and a document that is confidently incomplete is
# worse than one that admits a gap.
#
# So once a week this reads every commit the ledger does not cite, looks for the language
# people use when describing something that broke, and opens an issue listing them. It
# never writes a record: it cannot know a root cause or a lesson, and guessing those would
# fill the ledger with plausible fiction, which is the one thing it must not contain.

on:
  schedule:
    # Monday 08:00 UTC. Weekly rather than daily because the unit of work here is a
    # session, not a commit, and a daily nag gets muted.
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  ledger-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The harvester walks the whole history, so a shallow clone would report every
          # old commit as unrecorded.
          fetch-depth: 0
      - name: Check the ledger against the repository
        id: drift
        run: |
          python3 src/playbook_harvest.py | tee /tmp/drift.txt
          # A record citing no commit while main already names one is a fact nobody has
          # to remember and nobody is reading, so it goes in the same weekly report.
          python3 src/playbook_harvest.py --citations | tee -a /tmp/drift.txt
          if python3 src/playbook_harvest.py --check > /dev/null; then
            echo "behind=false" >> "$GITHUB_OUTPUT"
          else
            echo "behind=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild the playbook and verify it
        run: |
          python3 src/build_playbook.py
          node src/smoke_playbook.js || true
      - name: Open an issue when the ledger has fallen behind
        if: steps.drift.outputs.behind == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/drift.txt', 'utf8');
            const title = 'Playbook: the defect ledger has fallen behind';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'playbook',
            });
            const existing = open.data.find(i => i.title === title);
            const text = [
              'The weekly check found commits that read like they describe a defect and',
              'are not in `data/playbook/incidents.jsonl`.',
              '',
              'Write each one up, or add it to `data/playbook/cleared.jsonl` with a reason',
              'if it carries no real defect. A silent skip means the same commit is',
              're-investigated every week forever.',
              '',
              '`python3 src/playbook_harvest.py --json` prints skeletons to fill in.',
              '',
              '```',
              body.trim(),
              '```',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body: text,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body: text, labels: ['playbook'],
              });
            }

  # The exam guides cite a page for every figure, and validate_exams proves the citation is
  # there, not that the page still says it. Fees and dates change on the publisher's
  # schedule: the GRE fee sat at $220 for eight weeks after ETS's became $249 (INC-0132).
  # So once a week every cited page is read again and any number it no longer prints is
  # reported in an issue. Like the ledger check above, it never edits a fact: a miss can be
  # a paraphrase as easily as a change, and only reading the page tells which.
  exam-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the PDF reader and a browser for pages built by JavaScript
        run: |
          pip install pdfminer.six
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Check every exam fact against the page it cites
        id: sources
        run: |
          set +e
          echo "== Exam guides (data/exams.json)" > /tmp/sources.txt
          python3 src/check_sources.py --render >> /tmp/sources.txt 2>&1
          exams=$?
          # The school library's figures, the same way (INC-0133).
          echo "" >> /tmp/sources.txt
          echo "== MBA school library (data/schools)" >> /tmp/sources.txt
          python3 src/check_sources.py --schools --render >> /tmp/sources.txt 2>&1
          schools=$?
          cat /tmp/sources.txt
          if [ "$exams" = "1" ] || [ "$schools" = "1" ]; then echo "stale=true" >> "$GITHUB_OUTPUT"; else echo "stale=false" >> "$GITHUB_OUTPUT"; fi
      - name: Open an issue when a fact no longer matches its source
        if: steps.sources.outputs.stale == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/sources.txt', 'utf8');
            const title = 'Exam facts: a cited page no longer prints a figure we publish';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'sources',
            });
            const existing = open.data.find(i => i.title === title);
            const text = [
              'The weekly check read every page that `data/exams.json` and the school library cite and found',
              'numbers in our facts that those pages no longer print.',
              '',
              'Read each page. If the figure changed, correct the fact and every post that',
              'repeats it. If the fact is arithmetic on the page, add a `derived` entry',
              'with the working. If it is a paraphrase the check cannot see, reword the fact',
              'to the page. Run `python3 src/check_sources.py` to confirm.',
              '',
              '```',
              body.trim(),
              '```',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body: text,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body: text, labels: ['sources'],
              });
            }
