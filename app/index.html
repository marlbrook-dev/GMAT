{id:'V020',section:'V',type:'RC',passageId:'P2',passage:RC_P2,skill:'v_st',diff:2,
 stem:'The primary purpose of the passage is to',
 choices:['argue that coral reefs cannot survive rising ocean temperatures','explain the mechanism of coral bleaching and discuss a possible but uncertain adaptive response','advocate seeding vulnerable reefs with heat-tolerant algae','describe the unusual conditions of coral reefs in the Persian Gulf','compare the energy output of different types of symbiotic algae'],answer:1,
 expl:'Paragraph 1 explains bleaching; paragraphs 2 and 3 present symbiont shuffling and the debate about it, ending on "an open question." B.',
 wrong:'C overstates: the author reports proposals and criticisms without advocating. A is not the author\'s claim.'},
{id:'V021',section:'V',type:'RC',passageId:'P2',passage:RC_P2,skill:'v_st',diff:2,
 stem:'According to the passage, corals expel their algae because',
 choices:['the algae stop photosynthesizing when water is too warm','under heat stress the algae begin producing damaging reactive oxygen compounds','the coral requires the algae\'s pigment for protection','the surrounding water becomes too salty','competing corals invade the algae\'s tissue'],answer:1,
 expl:'Stated in paragraph 1: the photosynthetic machinery produces "damaging reactive oxygen compounds, and the coral expels them."'},
{id:'V022',section:'V',type:'RC',passageId:'P2',passage:RC_P2,skill:'v_inf',diff:3,
 stem:'It can be inferred from the passage that corals in the Persian Gulf',
 choices:['never experience bleaching','host algal types that tolerate temperatures that would cause bleaching elsewhere','grow faster than corals in other regions','were seeded with tolerant algae by researchers','lack zooxanthellae entirely'],answer:1,
 expl:'Gulf temperatures "routinely exceed those that trigger bleaching elsewhere," and Gulf corals "appear to rely on such tolerant symbionts." B is the supported inference.',
 wrong:'A is too strong ("never"). C contradicts the critics\' point about slower growth.'},
{id:'V023',section:'V',type:'RC',passageId:'P2',passage:RC_P2,skill:'v_ac',diff:4,
 stem:'The author mentions critics in the final paragraph primarily in order to',
 choices:['reject the proposal to seed reefs with heat-tolerant algae','present a consideration that qualifies the promise of symbiont shuffling','show that heat-tolerant algae harm the corals that host them','explain why corals expel their algae during heat waves','argue that research on coral adaptation should be discontinued'],answer:1,
 expl:'The critics introduce a trade-off (survival vs. competitiveness), and the author closes by calling the matter open. The critics qualify, not overturn. B.',
 wrong:'A and E overstate the author\'s stance. C distorts "transfer less energy" into "harm."'},
{id:'V024',section:'V',type:'RC',passageId:'P2',passage:RC_P2,skill:'v_inf',diff:4,
 stem:'Which of the following findings, if true, would most weaken the critics\' caution described in the final paragraph?',
 choices:['Heat-tolerant symbionts have been identified in reefs outside the Persian Gulf.','Corals hosting heat-tolerant symbionts grow and compete as well as corals hosting common types under ordinary temperature conditions.','Bleaching events are becoming more frequent worldwide.','Seeding reefs with heat-tolerant algae is expensive.','Some corals host several algal types simultaneously.'],answer:1,
 expl:'The critics\' concern is that shuffled corals lose ground in ordinary conditions. B directly denies that cost. The others do not address competitiveness.'}
];

// Verbal bank 2. 18 CR items (V101-V118) and three RC passages (V119-V133). skill: v_ac (Analysis/Critique), v_pc (Plan/Construct), v_inf (Identify Inferred Idea), v_st (Identify Stated Idea)
const RC_P3 = 'Price-matching guarantees, by which a retailer promises to match any lower price a customer finds at a competitor, are usually presented as evidence of vigorous competition. A retailer that binds itself to meet rivals\' prices, the reasoning goes, must expect its own prices to be low. Some economists, however, have argued that such guarantees can have the opposite effect. If every major retailer in a market promises to match, then a price cut by any one of them yields no gain in customers, since shoppers can obtain the lower price wherever they already shop. Knowing this, no retailer has an incentive to cut, and prices settle at a level higher than open rivalry would produce.\n\nEmpirical tests of this argument have been inconclusive. Studies of grocery and electronics markets have found that the adoption of guarantees is sometimes followed by higher prices and sometimes by lower ones. One plausible explanation for the mixed results is that guarantees differ in how easily they can be invoked. A guarantee that requires the customer to present a printed advertisement, or that excludes online sellers, is claimed by few shoppers and so imposes little discipline on either the retailer offering it or its rivals.';

const RC_P4 = 'Many trees, including oaks and beeches, do not produce seeds at a steady rate. Instead, they alternate years of scant production with occasional years in which every tree in a population sets an enormous crop, a phenomenon botanists call masting. Because these heavy years are synchronized across large areas, they cannot be explained by the fortunes of individual trees alone; some common signal, and some shared benefit, must be involved.\n\nTwo explanations of the benefit have dominated the literature. The predator-satiation hypothesis holds that by producing few seeds in most years, trees keep populations of seed-eating animals, such as rodents and weevils, low; a sudden glut then overwhelms the reduced predator population, so that a large fraction of seeds escapes consumption and germinates. The pollination-efficiency hypothesis holds instead that wind-pollinated trees benefit from flowering together, since the density of airborne pollen, and hence the proportion of flowers that set seed, rises when neighbors flower simultaneously. The two hypotheses are not mutually exclusive, and studies that measure both seed predation and pollination success in the same population have found support for each.\n\nWhat triggers a mast year is a separate question. For decades the favored answer was weather: a warm, dry spring, for example, was thought to induce heavy flowering the following year. But weather cues alone cannot account for the fact that a tree that has just produced a heavy crop rarely does so again the next year even when spring conditions are favorable. Recent models incorporate a resource budget: a tree accumulates stored carbohydrates and nutrients over several years, and only when reserves cross a threshold does a favorable weather cue prompt heavy flowering. Because the flowering exhausts the reserves, a second heavy year is precluded. Such models reproduce the observed pattern of irregular intervals between mast years more accurately than weather-only models, though the physiological basis of the proposed threshold remains poorly understood.';

const RC_P5 = 'Historians have long debated why free public libraries spread so rapidly across industrial towns in the second half of the nineteenth century. An older interpretation credited the movement to enlightened philanthropy: wealthy donors and reforming councillors, moved by a belief in self-improvement, gave working people access to books they could not otherwise afford. A revisionist school, writing in the 1970s and 1980s, recast the same donors as agents of social control. On this reading, libraries were designed to draw working men away from public houses and political meetings and to instill habits of quiet, orderly conduct; the reading rooms\' rules against conversation and their exclusion of radical newspapers were cited as evidence.\n\nMore recent work has questioned both accounts for treating library users as passive recipients of an institution designed by others. Studies of borrowing registers, petitions, and the minutes of mechanics\' institutes show that skilled workers frequently organized to demand libraries, campaigned for the local taxes that funded them, and, once libraries opened, borrowed fiction in far greater quantities than the improving literature their patrons preferred. Librarians who attempted to restrict novels found their circulation figures, and with them their budgets, in decline, and most quietly relented.\n\nThis does not mean the older interpretations are simply wrong. Donors did hope to shape conduct, and many acted from genuine conviction. But the institution that emerged was negotiated: its founders supplied buildings and rules, while its users, through their choices and their persistence, determined much of what the library actually became.';

const BANK_VERBAL2 = [
{id:'V101',section:'V',type:'CR',sub:'assumption',skill:'v_ac',diff:2,
 stem:'A regional airline plans to replace the 50-seat jets on its three busiest routes with 76-seat jets, noting that flights on those routes currently depart about 95 percent full. Executives predict that revenue per flight on these routes will rise substantially as a result.\n\nThe executives\' prediction depends on which of the following assumptions?',
 choices:['The 76-seat jets cost no more per flight to operate than the 50-seat jets they replace.','There is enough unmet passenger demand on the three routes to fill a substantial share of the additional seats.','The airline\'s least busy routes typically depart less than half full.','The 76-seat jets will operate the same number of flights per day as the 50-seat jets do now.','Fares on the three busiest routes are higher than fares on the airline\'s other routes.'],answer:1,
 expl:'Conclusion: revenue per flight will rise substantially. Evidence: current flights are nearly full. The gap is whether extra seats will actually be sold. If there is no unmet demand, the larger jet carries the same passengers and revenue per flight does not change. Negating B destroys the prediction, so B is required.',
 wrong:'A concerns cost, but the conclusion is about revenue, not profit. D is about flights per day, while the conclusion is per flight.'},
{id:'V102',section:'V',type:'CR',sub:'assumption',skill:'v_ac',diff:3,
 stem:'Company memo: In the quarter after we outsourced customer-service calls to an outside vendor, our customer-satisfaction scores fell sharply. The vendor\'s agents resolve calls on the first attempt far less often than our former in-house agents did, and this is what drove the decline. To restore our satisfaction scores, we should bring call handling back in-house.\n\nThe memo\'s recommendation relies on which of the following assumptions?',
 choices:['The company would be able to staff an in-house call center with agents whose first-call resolution rate is comparable to that of its former in-house agents.','The vendor charges the company more for call handling than the in-house operation cost.','Customer-satisfaction scores are the most important measure of the company\'s performance.','No other company that has outsourced call handling has experienced a decline in customer satisfaction.','The vendor\'s agents have less experience than the company\'s former in-house agents had.'],answer:0,
 expl:'Conclusion: bringing calls back in-house will restore satisfaction. The premise is that the vendor\'s low first-call resolution caused the drop. The gap is whether the in-house operation would actually recover the earlier resolution rate. If the company cannot rebuild a comparably skilled team, moving the calls back would not fix the problem. A is necessary.',
 wrong:'E explains why the vendor performs worse but is not needed; the memo already asserts the performance gap. B is about cost, which the recommendation does not address.'},
{id:'V103',section:'V',type:'CR',sub:'assumption',skill:'v_ac',diff:4,
 stem:'Economist: Countries whose central banks adopted explicit numerical inflation targets in the 1990s experienced lower average inflation over the following decade than countries whose central banks did not. Because a published target commits a central bank publicly to a specific goal, the commitment itself must have lowered the public\'s inflation expectations, and those lower expectations account for the lower inflation.\n\nWhich of the following is an assumption on which the economist\'s argument depends?',
 choices:['A majority of the world\'s central banks adopted numerical inflation targets during the 1990s.','Inflation expectations can be measured accurately through surveys of professional forecasters.','Countries that adopted inflation targets also experienced faster economic growth than countries that did not.','The central banks that adopted targets were not, before adoption, already more committed to low inflation than the central banks that did not.','Inflation in the adopting countries fell to exactly the level specified by their targets.'],answer:3,
 expl:'Conclusion: the public commitment caused lower inflation via expectations. The comparison between adopters and non-adopters supports this only if the two groups were otherwise alike. If the adopters were already the more inflation-averse central banks, their lower inflation could reflect that pre-existing stance rather than the target. D rules out this selection effect and is required.',
 wrong:'B is a measurement detail; the argument does not rely on any particular survey. E is far stronger than the argument needs, since the conclusion is only that inflation was lower.'},
{id:'V104',section:'V',type:'CR',sub:'weaken',skill:'v_ac',diff:2,
 stem:'A software company found that new customers who attend its optional onboarding webinar renew their subscriptions at twice the rate of new customers who do not attend. The company therefore plans to make the webinar mandatory for all new customers and expects its overall renewal rate to rise substantially.\n\nWhich of the following, if true, most seriously weakens the company\'s expectation?',
 choices:['Roughly a third of new customers currently choose to attend the webinar.','The webinar lasts about ninety minutes and is offered twice a week.','New customers who choose to attend the webinar are largely those who had already decided to use the software heavily before signing up.','Some customers who attend the webinar do not renew their subscriptions.','Several of the company\'s competitors offer similar onboarding webinars.'],answer:2,
 expl:'Conclusion: making the webinar mandatory will raise renewal rates. The evidence is a correlation between attendance and renewal. C supplies self-selection: attendees were already committed users, so the webinar may not be what causes their higher renewal, and forcing others to attend need not change their behavior.',
 wrong:'D says only that some attendees fail to renew, which is consistent with a rate twice as high. A gives context but does not attack the causal link.'},
{id:'V105',section:'V',type:'CR',sub:'weaken',skill:'v_ac',diff:4,
 stem:'Historian: In the four decades after a canal connected the inland town of Verrin to the coast in 1820, Verrin\'s population tripled. Letters and newspapers from the period describe merchants moving to Verrin to take advantage of cheaper shipping. It is clear that the canal was the principal cause of Verrin\'s growth.\n\nWhich of the following, if true, most seriously weakens the historian\'s argument?',
 choices:['The canal froze and was closed to traffic for roughly three months of every year.','Verrin\'s population had been growing slowly in the decades before 1820.','Most of the surviving letters and newspaper accounts from Verrin were written by merchants who used the canal.','During the same four decades, towns in the region that had no canal access grew at similar rates because of a widespread agricultural boom.','By 1870 a railroad had replaced the canal as Verrin\'s main link to the coast.'],answer:3,
 expl:'Conclusion: the canal was the principal cause of Verrin\'s growth. D shows that comparable towns without a canal grew just as fast, pointing to a regional cause (the agricultural boom) that would have produced Verrin\'s growth with or without the canal. That directly undercuts the canal\'s claimed role.',
 wrong:'C questions the sources\' neutrality but does not offer any competing explanation for the tripling. A limits the canal\'s use but leaves it operating most of the year.'},
{id:'V106',section:'V',type:'CR',sub:'weaken',skill:'v_ac',diff:3,
 stem:'In a clinical trial, patients with a certain sleep disorder who took a new drug reported 30 percent fewer awakenings during the night than patients who took a placebo. The researchers concluded that the drug improves sleep continuity in patients with the disorder.\n\nWhich of the following, if true, most seriously weakens the researchers\' conclusion?',
 choices:['The drug induces a grogginess that impairs patients\' ability to recall having woken during the night, and bedside monitors recorded no difference in the number of awakenings between the two groups.','The placebo group contained slightly more women than the drug group did.','The new drug is considerably more expensive than treatments already on the market.','A few patients in the drug group reported no reduction in awakenings.','Patients in both groups were told at the outset that they might receive a placebo.'],answer:0,
 expl:'Conclusion: the drug improves sleep continuity. Evidence: patients reported fewer awakenings. A shows that the reports are unreliable (the drug blunts recall) and that objective monitoring found no difference, so the evidence does not show what the researchers claim.',
 wrong:'D describes a few exceptions, which is compatible with a 30 percent average reduction. E describes standard trial design and does not favor either group.'},
{id:'V107',section:'V',type:'CR',sub:'strengthen',skill:'v_ac',diff:3,
 stem:'In Country Y, the number of new small businesses registered each year rose 40 percent after the government cut the registration fee from the equivalent of $500 to $50. Analysts concluded that the old fee had been deterring many people from formally registering businesses they were already operating informally.\n\nWhich of the following, if true, most strengthens the analysts\' conclusion?',
 choices:['Registration fees in the countries neighboring Country Y remain close to $500.','At the same time that it cut the fee, the government launched a nationwide campaign encouraging citizens to start businesses.','Tax revenue collected from small businesses in Country Y rose in the year after the fee was cut.','Small businesses employ roughly half of Country Y\'s workforce.','A survey of businesses registered after the fee cut found that most had been operating without registration for at least a year beforehand.'],answer:4,
 expl:'Conclusion: the fee had been deterring registration of existing informal businesses. The gap is that the new registrations might instead be genuinely new ventures. E shows directly that most of the new registrants were pre-existing informal businesses, which is exactly what the analysts claim.',
 wrong:'B weakens by offering an alternative cause for the increase. C is consistent with either explanation and does not distinguish them.'},
{id:'V108',section:'V',type:'CR',sub:'strengthen',skill:'v_ac',diff:4,
 stem:'A manufacturer of industrial pumps replaced the steel bearings in one of its pump models with ceramic bearings. In the year that followed, warranty claims on that model fell by half. The manufacturer concluded that ceramic bearings are more durable than steel bearings under the conditions in which its pumps operate.\n\nWhich of the following, if true, most strengthens the manufacturer\'s conclusion?',
 choices:['Ceramic bearings cost considerably more than steel bearings.','The manufacturer\'s other pump models continued to use steel bearings.','Before the change, bearing failure accounted for the large majority of warranty claims on that model, and no other change was made to the model\'s design or manufacturing during the period.','At the time of the change, the manufacturer shortened the warranty period on the model from two years to one.','Ceramic bearings are widely used in aerospace applications.'],answer:2,
 expl:'Conclusion: ceramic bearings are more durable. The gap is whether the drop in claims actually reflects fewer bearing failures. C establishes that bearing failures were what drove the claims and that nothing else changed, so the halving of claims is best explained by more durable bearings.',
 wrong:'D weakens by supplying an alternative reason claims fell. B is neutral background about other models.'},
{id:'V109',section:'V',type:'CR',sub:'evaluate',skill:'v_ac',diff:3,
 stem:'A city transit agency reports that in the year after it introduced a mobile ticketing app, fare evasion on its buses fell 15 percent. The agency attributes the decline to the app, reasoning that riders who found it inconvenient to buy paper tickets are now paying their fares.\n\nWhich of the following would it be most useful to know in order to evaluate the agency\'s explanation?',
 choices:['How much the agency spent to develop the app','Whether riders on the city\'s commuter trains also use the app','Whether the app is available on both major smartphone operating systems','Whether the agency increased the frequency of fare inspections on buses during the same year','Whether fare evasion is more common on buses than on trains'],answer:3,
 expl:'Conclusion: the app caused the decline in evasion. The main threat is an alternative cause. If inspections rose at the same time, the decline could reflect enforcement rather than convenience; if they did not, the app explanation is stronger. D discriminates between the possibilities.',
 wrong:'C bears on how many riders could use the app but does not test whether the app, rather than something else, produced the decline. A and E are irrelevant to the causal claim.'},
{id:'V110',section:'V',type:'CR',sub:'evaluate',skill:'v_ac',diff:4,
 stem:'A publisher observed that its books released with an audiobook edition on the same day sold, on average, 20 percent more print copies in their first month than its books released without a simultaneous audiobook. The publisher plans to release audiobooks simultaneously with all future titles in order to boost print sales.\n\nWhich of the following would it be most useful to know in order to evaluate the publisher\'s reasoning?',
 choices:['Whether audiobook sales industrywide are growing faster than print sales','Whether the publisher chose to produce simultaneous audiobooks mainly for titles it already expected to be strong sellers','How much it costs the publisher to produce an audiobook edition','Whether print sales of the books with simultaneous audiobooks were also higher in their second month','Whether the publisher\'s competitors release audiobooks simultaneously with print editions'],answer:1,
 expl:'Conclusion: simultaneous audiobooks boost print sales. The comparison is meaningful only if the two groups of books were otherwise comparable. If the publisher gave audiobooks to its expected bestsellers, the higher print sales may reflect the selection rather than the audiobook. B tests exactly that.',
 wrong:'C concerns whether the plan is worth its cost, not whether the causal reasoning is sound. D adds detail about the same correlation without testing its cause.'},
{id:'V111',section:'V',type:'CR',sub:'inference',skill:'v_pc',diff:3,
 stem:'At Bramford Bank, every loan officer who approved more than 50 loans last year received a bonus. No loan officer who received a bonus had a default rate above 3 percent on the loans he or she approved. Some loan officers whose default rates were below 3 percent did not receive a bonus.\n\nIf the statements above are true, which of the following must also be true?',
 choices:['Every loan officer who approved 50 or fewer loans had a default rate below 3 percent.','Some loan officers who approved more than 50 loans did not receive a bonus.','Most of the bank\'s loan officers received a bonus.','Every loan officer who did not receive a bonus had a default rate above 3 percent.','No loan officer with a default rate above 3 percent approved more than 50 loans.'],answer:4,
 expl:'Chain the rules: more than 50 loans leads to a bonus, and a bonus rules out a default rate above 3 percent. So anyone above 3 percent cannot have received a bonus and therefore cannot have approved more than 50 loans. E is the contrapositive of the chain and must be true.',
 wrong:'B contradicts the first statement. D contradicts the third statement, which says some low-default officers got no bonus. A reverses the logic.'},
{id:'V112',section:'V',type:'CR',sub:'inference',skill:'v_pc',diff:4,
 stem:'A consulting firm bills its clients only for hours logged by its consultants. Last year the firm\'s total billed hours rose 10 percent over the previous year, while the number of consultants it employed fell. The firm\'s total revenue from billed hours, however, was the same in both years.\n\nWhich of the following can be properly concluded from the statements above?',
 choices:['The firm laid off its highest-billing consultants last year.','The firm\'s profit was lower last year than the year before.','The firm\'s average revenue per billed hour was lower last year than the year before.','Each consultant billed more hours last year than in the previous year.','The firm employed fewer consultants last year than any of its competitors did.'],answer:2,
 expl:'Revenue from billed hours equals hours multiplied by average revenue per hour. Hours rose 10 percent while revenue stayed flat, so revenue per hour must have fallen. C follows directly.',
 wrong:'D overreaches: the average hours per consultant rose, but that does not mean each individual billed more. B introduces costs, about which nothing is stated.'},
{id:'V113',section:'V',type:'CR',sub:'plan',skill:'v_pc',diff:3,
 stem:'An online clothing retailer receives a large number of returns from customers who ordered the wrong size. To reduce such returns, the retailer plans to add a tool to its website that recommends a size for each garment based on the customer\'s height, weight, and body measurements.\n\nWhich of the following, if true, provides the strongest support for the prediction that the plan will reduce sizing-related returns?',
 choices:['Use of the recommendation tool will be optional for customers.','Many customers deliberately order a garment in two sizes, intending to return the one that fits less well.','Returns because a garment\'s color differed from its online image are also common.','Most sizing-related returns come from customers who ordered the size they usually wear at other retailers, whose sizes are cut differently from this retailer\'s.','The retailer\'s shipping costs have risen substantially over the past year.'],answer:3,
 expl:'The plan works if the tool addresses the actual cause of sizing errors. D says most such errors arise from customers applying other retailers\' sizes; a tool that recommends this retailer\'s size from body measurements targets precisely that mistake, so returns should fall.',
 wrong:'B weakens: customers ordering two sizes on purpose will keep returning one regardless of any recommendation. A also weakens slightly, since fewer customers may use the tool.'},
{id:'V114',section:'V',type:'CR',sub:'plan',skill:'v_pc',diff:4,
 stem:'To relieve crowding in its emergency room, a hospital plans to open a walk-in clinic next door for patients with minor ailments and to post signs in the emergency room directing such patients to the clinic.\n\nWhich of the following, if true, most seriously calls into question the likelihood that the plan will achieve its goal?',
 choices:['The clinic will be open only during weekday business hours.','Most of the crowding in the emergency room results from patients who have been admitted to the hospital but are waiting for inpatient beds to become available, not from patients with minor ailments.','The clinic will be staffed primarily by nurse practitioners rather than physicians.','Patients with minor ailments generally wait longer in the emergency room than patients with serious conditions.','Emergency rooms at nearby hospitals are also crowded.'],answer:1,
 expl:'Goal: relieve emergency-room crowding. Mechanism: divert minor-ailment patients. B shows that minor-ailment patients are not the main source of crowding, so diverting them will barely affect the problem. The plan misidentifies the cause.',
 wrong:'A limits the plan\'s reach but leaves it effective during business hours; B undermines the plan at any hour. D, if anything, suggests diversion would help those patients.'},
{id:'V115',section:'V',type:'CR',sub:'paradox',skill:'v_pc',diff:4,
 stem:'Over the past decade the number of full-service restaurants in the town of Milton has doubled. Milton\'s population has not changed over the period, yet the average number of diners served per restaurant each week has not fallen.\n\nWhich of the following, if true, most helps to explain the pattern described above?',
 choices:['Menu prices at Milton\'s restaurants have risen faster than the general rate of inflation.','Most of the restaurants that opened during the decade are located in Milton\'s downtown district.','Milton\'s residents have higher average incomes than residents of neighboring towns.','Several restaurants that were operating in Milton ten years ago have since closed.','Over the decade Milton has become a regional dining destination, drawing large numbers of diners from surrounding towns that have few restaurants of their own.'],answer:4,
 expl:'Twice as many restaurants and a flat population should mean fewer diners per restaurant, unless total dining rose. E supplies the missing diners: they come from outside the town, so the local population figure understates the market.',
 wrong:'C describes a static condition, not a change over the decade, and so cannot explain a doubling in capacity being absorbed. D does not help; the count still doubled net of closures.'},
{id:'V116',section:'V',type:'CR',sub:'boldface',skill:'v_ac',diff:4,
 stem:'Marine biologist: [1] Sea otter populations along the northern coast have rebounded to roughly their levels before commercial hunting began. Some officials have concluded from this that the species no longer needs protection there. But otter numbers in the region depend heavily on the kelp forests in which the animals feed and shelter, and [2] recent ocean warming has thinned those forests substantially. The recovery may therefore prove short-lived, and protection should continue.\n\nIn the argument, the two portions in brackets play which of the following roles?',
 choices:['The first is evidence that the argument disputes; the second is the argument\'s main conclusion.','The first is the argument\'s main conclusion; the second is a premise offered in support of it.','The first is a finding the argument accepts and that others cite in support of a position the argument opposes; the second is evidence offered in support of the argument\'s main conclusion.','The first is a premise supporting the argument\'s main conclusion; the second is a claim the argument rejects.','The first is a position the argument opposes; the second is a finding that undermines that position.'],answer:2,
 expl:'The biologist does not dispute that otters have rebounded; the officials use that finding to argue against protection, which is the position the biologist rejects. The thinning of kelp forests is the biologist\'s own evidence for the conclusion that protection should continue. C describes both roles accurately.',
 wrong:'E misdescribes the first portion: the rebound is a fact the biologist accepts, not the position opposed (the officials\' conclusion is). A wrongly says the first is disputed.'},
{id:'V117',section:'V',type:'CR',sub:'flaw',skill:'v_ac',diff:3,
 stem:'Marketing director: Our new advertising campaign has clearly succeeded. In the month since it began, visits to our website have risen 25 percent. Since the campaign is the only marketing initiative we launched this month, it must be responsible for the increase.\n\nThe director\'s reasoning is most vulnerable to criticism on the grounds that it',
 choices:['presumes, without justification, that an increase in website visits will lead to an increase in sales','fails to specify how the success of an advertising campaign should be measured','assumes that attracting website visits was the campaign\'s primary objective','overlooks the possibility that something other than the company\'s own marketing initiatives caused the increase in visits','generalizes from the results of a single campaign to all future campaigns'],answer:3,
 expl:'Conclusion: the campaign caused the rise in visits. The director rules out only other marketing initiatives, but visits could have risen for reasons outside the company\'s marketing (seasonal demand, news coverage, a competitor\'s outage). D names that gap.',
 wrong:'A criticizes a further step the director never takes; the conclusion is about visits, not sales. E describes a generalization that is not made.'},
{id:'V118',section:'V',type:'CR',sub:'complete',skill:'v_pc',diff:3,
 stem:'Economist: A tax credit for first-time homebuyers is meant to make homes more affordable for such buyers. But in cities where the supply of housing cannot expand quickly, the additional buyers the credit draws into the market will bid up prices by roughly the amount of the credit. In such cities, therefore, the credit ______.\n\nWhich of the following most logically completes the argument?',
 choices:['will chiefly benefit those who already own homes and sell them, rather than the first-time buyers it is meant to help','will reduce the number of homes sold each year','should be replaced by a subsidy for renters','will make housing more affordable for buyers who do not qualify for the credit','will cause the supply of housing to expand more quickly'],answer:0,
 expl:'If prices rise by about the credit amount, first-time buyers pay the same net price as before while sellers receive more. The logical completion is that the gain is captured by sellers, not the intended beneficiaries. A follows.',
 wrong:'D contradicts the premise, since higher prices hurt buyers who get no credit. C is a policy recommendation the premises do not support.'},
{id:'V119',section:'V',type:'RC',passageId:'P3',passage:RC_P3,skill:'v_st',diff:2,
 stem:'The passage is primarily concerned with',
 choices:['arguing that price-matching guarantees invariably lead to higher prices','presenting a counterintuitive account of price-matching guarantees and noting that the evidence for it is mixed','recommending that regulators prohibit price-matching guarantees','explaining why customers rarely take advantage of price-matching guarantees','comparing the effects of guarantees in grocery markets with their effects in electronics markets'],answer:1,
 expl:'Paragraph 1 introduces the usual view, then the economists\' contrary account; paragraph 2 reports inconclusive evidence and offers a reason for the mixed results. B captures both movements.',
 wrong:'A overstates: the passage says evidence is inconclusive. D describes one detail in the final sentence, not the passage\'s concern.'},
{id:'V120',section:'V',type:'RC',passageId:'P3',passage:RC_P3,skill:'v_st',diff:3,
 stem:'According to the passage, when every major retailer in a market offers a price-matching guarantee, a price cut by one retailer',
 choices:['is quickly followed by improvements in rivals\' service','draws customers away from rival retailers','gains that retailer no additional customers, because shoppers can obtain the lower price where they already shop','violates the terms of the other retailers\' guarantees','sets off a general reduction in prices across the market'],answer:2,
 expl:'Stated in paragraph 1: a cut "yields no gain in customers, since shoppers can obtain the lower price wherever they already shop."',
 wrong:'B and E describe what would happen under open rivalry, which the passage contrasts with the guarantee scenario.'},
{id:'V121',section:'V',type:'RC',passageId:'P3',passage:RC_P3,skill:'v_inf',diff:4,
 stem:'It can be inferred that the author would most likely agree with which of the following statements about a price-matching guarantee that requires customers to present a printed advertisement?',
 choices:['It is more common in electronics markets than in grocery markets.','It is unlikely to have much effect on prices in either direction.','It offers strong evidence that the retailer is coordinating with its rivals.','It is more effective than other guarantees at retaining loyal customers.','It has been prohibited in several markets.'],answer:1,
 expl:'The final sentence says such a guarantee is claimed by few shoppers and "imposes little discipline on either the retailer offering it or its rivals." A guarantee that constrains no one is unlikely to move prices much either way. B follows.',
 wrong:'C reverses the point: a hard-to-invoke guarantee is weak evidence of anything. A and E are not supported by the passage.'},
{id:'V122',section:'V',type:'RC',passageId:'P3',passage:RC_P3,skill:'v_ac',diff:3,
 stem:'The author mentions studies of grocery and electronics markets primarily in order to',
 choices:['show that the economists\' argument has been confirmed empirically','suggest that guarantees are more prevalent in some industries than in others','identify the markets in which price-matching guarantees were first introduced','illustrate that the evidence on the price effects of guarantees is inconsistent','argue that customers seldom invoke guarantees'],answer:3,
 expl:'The studies are cited immediately after the claim that "empirical tests of this argument have been inconclusive" and are described as finding higher prices in some cases and lower in others. Their role is to illustrate the inconsistency.',
 wrong:'A contradicts the passage. E is a point the author makes later about specific guarantee designs, not the purpose of citing the studies.'},
{id:'V123',section:'V',type:'RC',passageId:'P3',passage:RC_P3,skill:'v_inf',diff:5,
 stem:'Which of the following findings, if true, would most strengthen the economists\' argument described in the first paragraph?',
 choices:['Retailers that offer price-matching guarantees advertise more heavily than those that do not.','Retailers that offer price-matching guarantees have higher operating costs than those that do not.','In a market where all major retailers adopted easily invoked guarantees, prices fell in the following year.','Most shoppers are unaware of whether their usual retailer offers a guarantee.','In markets where only one major retailer offers a guarantee, prices are lower than in otherwise similar markets where all major retailers do.'],answer:4,
 expl:'The economists claim that when every retailer guarantees, no one has an incentive to cut and prices settle higher. E compares universal adoption with a single adopter in similar markets and finds higher prices under universal adoption, which is exactly the predicted effect.',
 wrong:'C weakens the argument, since easily invoked universal guarantees should, on the economists\' view, raise prices. D suggests guarantees have little influence on behavior, which does not help the argument.'},
{id:'V124',section:'V',type:'RC',passageId:'P4',passage:RC_P4,skill:'v_st',diff:2,
 stem:'The primary purpose of the passage is to',
 choices:['argue that predator satiation is the correct explanation of masting','demonstrate that spring weather determines when trees produce heavy seed crops','explain how rodent populations respond to sudden gluts of seed','describe masting and survey explanations of both its benefit and its trigger','criticize botanists for neglecting the physiology of flowering'],answer:3,
 expl:'Paragraph 1 defines masting, paragraph 2 reviews two hypotheses about its benefit, and paragraph 3 turns to what triggers it. D covers the whole passage.',
 wrong:'A picks one hypothesis the author treats as compatible with another. B contradicts paragraph 3, which says weather alone is insufficient.'},
{id:'V125',section:'V',type:'RC',passageId:'P4',passage:RC_P4,skill:'v_st',diff:2,
 stem:'According to the predator-satiation hypothesis as described in the passage, producing few seeds in most years serves to',
 choices:['keep populations of seed-eating animals low','allow trees to accumulate stored carbohydrates','increase the density of airborne pollen','synchronize flowering across a population','reduce competition among seedlings'],answer:0,
 expl:'Paragraph 2 states that by producing few seeds in most years, trees "keep populations of seed-eating animals, such as rodents and weevils, low."',
 wrong:'B belongs to the resource-budget model in paragraph 3, and C to the pollination-efficiency hypothesis. Both are true elsewhere in the passage but are not what the predator-satiation hypothesis claims.'},
{id:'V126',section:'V',type:'RC',passageId:'P4',passage:RC_P4,skill:'v_inf',diff:3,
 stem:'The passage suggests which of the following about models that rely on weather cues alone to predict mast years?',
 choices:['They have been abandoned entirely by botanists.','They predict masting more accurately in oaks than in beeches.','They cannot account for the rarity of heavy seed crops in consecutive years.','They overlook the effect of seed predators on germination.','They assume that trees flower in every year.'],answer:2,
 expl:'Paragraph 3 says weather cues alone "cannot account for the fact that a tree that has just produced a heavy crop rarely does so again the next year even when spring conditions are favorable." C restates this.',
 wrong:'A is too strong; the passage says resource-budget models are more accurate, not that weather models were discarded. D concerns the benefit question, not the trigger models.'},
{id:'V127',section:'V',type:'RC',passageId:'P4',passage:RC_P4,skill:'v_st',diff:3,
 stem:'Which of the following best describes the function of the third paragraph?',
 choices:['It resolves the disagreement between the two hypotheses presented in the second paragraph.','It introduces evidence that masting does not occur in most tree species.','It summarizes the arguments made in the first two paragraphs.','It questions whether mast years are truly synchronized across populations.','It shifts from the question of why masting is beneficial to the question of what triggers it, and presents a refined model.'],answer:4,
 expl:'The paragraph opens by calling the trigger "a separate question," describes the older weather explanation, and then presents the resource-budget model that improves on it. E describes this transition and content.',
 wrong:'A is wrong because the paragraph does not return to the benefit hypotheses at all. D contradicts paragraph 1, which treats synchronization as established.'},
{id:'V128',section:'V',type:'RC',passageId:'P4',passage:RC_P4,skill:'v_inf',diff:5,
 stem:'Which of the following observations, if made, would most seriously call into question the resource-budget model described in the passage?',
 choices:['Populations of seed-eating rodents decline sharply in the years following a mast year.','Trees given supplemental nutrients so that their reserves remain high after a mast year still fail to flower heavily the following spring despite favorable weather.','Masting is less common among tropical trees than among temperate ones.','Warm, dry springs precede most recorded mast years.','Pollination success in a population is markedly higher in mast years than in other years.'],answer:1,
 expl:'The model holds that a favorable weather cue triggers heavy flowering whenever reserves are above the threshold, and that consecutive mast years fail to occur only because reserves are exhausted. If trees with artificially maintained reserves and favorable weather still do not mast, the model\'s explanation of the one-year gap is undermined.',
 wrong:'D is consistent with the model, which retains weather as the cue. A and E bear on the benefit hypotheses, not on the trigger model.'},
{id:'V129',section:'V',type:'RC',passageId:'P5',passage:RC_P5,skill:'v_st',diff:3,
 stem:'Which of the following best expresses the main idea of the passage?',
 choices:['The revisionist account of public libraries has been decisively refuted by evidence from borrowing registers.','Philanthropic donors were the primary force behind the spread of public libraries.','Recent scholarship shows that public libraries were shaped by their users as well as their founders, complicating both earlier interpretations.','Working-class readers in the nineteenth century preferred fiction to improving literature.','Public libraries failed to achieve the social control their founders intended.'],answer:2,
 expl:'The passage presents two older interpretations, then recent work emphasizing users\' agency, and closes by describing the library as "negotiated" between founders and users. C states this synthesis.',
 wrong:'A and E overstate: the final paragraph says the older views are not "simply wrong." D is a supporting detail, not the main idea.'},
{id:'V130',section:'V',type:'RC',passageId:'P5',passage:RC_P5,skill:'v_st',diff:2,
 stem:'According to the passage, revisionist historians cited which of the following as evidence for their interpretation?',
 choices:['Borrowing registers showing high circulation of fiction','Petitions organized by skilled workers','The minutes of mechanics\' institutes','Reading-room rules against conversation and the exclusion of radical newspapers','Statements by donors describing their motives'],answer:3,
 expl:'Paragraph 1 says the reading rooms\' rules against conversation and their exclusion of radical newspapers "were cited as evidence" for the social-control reading.',
 wrong:'A, B, and C are the sources used by the more recent scholars described in paragraph 2, not by the revisionists.'},
{id:'V131',section:'V',type:'RC',passageId:'P5',passage:RC_P5,skill:'v_inf',diff:3,
 stem:'The passage suggests that librarians who tried to restrict access to novels generally abandoned the effort because',
 choices:['declining circulation threatened their budgets','donors instructed them to relent','workers petitioned local councils to intervene','they came to share their readers\' taste for fiction','new laws required libraries to lend fiction'],answer:0,
 expl:'Paragraph 2 says such librarians "found their circulation figures, and with them their budgets, in decline, and most quietly relented." The budget pressure is the implied reason.',
 wrong:'B, C, and E introduce actors and mechanisms the passage never mentions in connection with the librarians\' retreat.'},
{id:'V132',section:'V',type:'RC',passageId:'P5',passage:RC_P5,skill:'v_inf',diff:4,
 stem:'The author\'s attitude toward the two older interpretations described in the first paragraph can best be characterized as',
 choices:['outright dismissal of both as unsupported by evidence','uncritical endorsement of the philanthropic account','indifference to the question of donors\' motives','hostility toward the revisionist account alone','qualified acceptance, granting that they capture the founders\' aims while faulting them for neglecting users'],answer:4,
 expl:'The final paragraph says the older interpretations are not "simply wrong," concedes that donors hoped to shape conduct and often acted sincerely, but insists that users determined much of what the library became. That is qualified acceptance.',
 wrong:'A ignores the explicit concession in the last paragraph. D singles out one account, whereas the author treats both the same way.'},
{id:'V133',section:'V',type:'RC',passageId:'P5',passage:RC_P5,skill:'v_ac',diff:4,
 stem:'The author mentions that workers borrowed fiction in far greater quantities than improving literature primarily in order to',
 choices:['show that public libraries failed in their educational mission','illustrate that users\' choices diverged from the intentions of the libraries\' patrons','argue that fiction was of higher literary quality than improving literature','support the revisionist claim that libraries were instruments of social control','explain how public libraries were funded'],answer:1,
 expl:'The detail appears in the paragraph arguing that users were not passive recipients. Borrowing fiction rather than the literature patrons preferred shows users exercising their own preferences against founders\' intentions. B captures that role.',
 wrong:'A imposes a judgment of failure the author does not make. D reverses the point, since the detail cuts against the social-control reading.'}
];

// Data Sufficiency
{id:'D001',section:'DI',type:'DS',domain:'math',skill:'di_ds',qskill:'q_alg',diff:2,
 stem:'Is x > 5?\n\n(1) x^2 > 25\n(2) x > 4',choices:DS_CHOICES,answer:2,
 expl:'(1) x > 5 or x < -5: not sufficient. (2) x could be 4.5 or 6: not sufficient. Together: x > 4 and (x > 5 or x < -5) forces x > 5. Sufficient. C.',
 wrong:'Trap: treating x^2 > 25 as x > 5. Squares hide negatives.'},
{id:'D002',section:'DI',type:'DS',domain:'math',skill:'di_ds',qskill:'q_rrp',diff:3,
 stem:'What is the ratio of the number of boys to the number of girls in a certain class?\n\n(1) 40 percent of the students in the class are boys.\n(2) There are 12 boys in the class.',choices:DS_CHOICES,answer:0,
 expl:'(1) Boys 40%, girls 60%, ratio 2:3. Sufficient. (2) 12 boys, unknown girls. Not sufficient. A.',
 wrong:'A ratio question needs relative sizes, not counts. Percent gives the ratio directly.'},
{id:'D003',section:'DI',type:'DS',domain:'math',skill:'di_ds',qskill:'q_vof',diff:3,
 stem:'Is the positive integer n divisible by 6?\n\n(1) n is divisible by 3.\n(2) n is divisible by 4.',choices:DS_CHOICES,answer:2,

{id:'D004',section:'DI',type:'DS',domain:'math',skill:'di_ds',qskill:'q_alg',diff:4,

{id:'D005',section:'DI',type:'DS',domain:'math',skill:'di_ds',qskill:'q_rrp',diff:3,

{id:'D101',section:'DI',type:'DS',domain:'math',skill:'di_ds',qskill:'q_alg',diff:3,
 stem:'If x and y are integers, is x + y even?\n\n(1) x - y is even.\n(2) xy is odd.',choices:DS_CHOICES,answer:3,
 expl:'(1) x - y even means x and y have the same parity; the sum of two same-parity integers is even. Sufficient. (2) xy odd means both x and y are odd, so x + y is even. Sufficient. Each alone works. D.',
 wrong:'Trap: assuming a product condition cannot pin down a sum. Odd product forces both factors odd.'},
{id:'D102',section:'DI',type:'DS',domain:'math',skill:'di_ds',qskill:'q_rrp',diff:3,
 stem:'A store sold a jacket at a discount from its list price. What was the discounted price of the jacket?\n\n(1) The discount was 20 percent of the list price.\n(2) The discounted price was $16 less than the list price.',choices:DS_CHOICES,answer:2,
 expl:'(1) 20% off an unknown list price: not sufficient. (2) $16 off an unknown list price: not sufficient. Together: 0.20L = 16, so L = 80 and the discounted price is 64. Sufficient. C.',
 wrong:'A percent and a dollar amount for the same quantity together fix the base.'},
{id:'D103',section:'DI',type:'DS',domain:'math',skill:'di_ds',qskill:'q_vof',diff:4,
 stem:'If n is a positive integer, what is the remainder when n is divided by 8?\n\n(1) When n is divided by 16, the remainder is 5.\n(2) When n is divided by 4, the remainder is 1.',choices:DS_CHOICES,answer:0,
 expl:'(1) n = 16k + 5 = 8(2k) + 5, so the remainder on division by 8 is 5. Sufficient. (2) n = 1, 5, 9, 13 give remainders 1, 5, 1, 5 on division by 8. Not sufficient. A.',
 wrong:'A remainder modulo a multiple of 8 determines the remainder modulo 8; a remainder modulo a divisor of 8 does not.'},
{id:'D104',section:'DI',type:'DS',domain:'math',skill:'di_ds',qskill:'q_csp',diff:3,
 stem:'A bag contains only red marbles and blue marbles. If one marble is selected at random from the bag, what is the probability that it is red?\n\n(1) There are 12 more blue marbles than red marbles in the bag.\n(2) The number of blue marbles in the bag is 3 times the number of red marbles.',choices:DS_CHOICES,answer:1,
 expl:'(1) 1 red and 13 blue gives 1/14; 12 red and 24 blue gives 1/3. Not sufficient. (2) Red : blue = 1 : 3, so red is 1/4 of the total. Sufficient. B.',
 wrong:'Probability needs the ratio, not the counts. A difference gives neither; a ratio is enough.'},
{id:'D105',section:'DI',type:'DS',domain:'math',skill:'di_ds',qskill:'q_alg',diff:5,
 stem:'Is x > y?\n\n(1) x^2 > y^2\n(2) x + y > 0',choices:DS_CHOICES,answer:2,
 expl:'(1) x = 3, y = 2 (yes); x = -3, y = 2 (no). Not sufficient. (2) x = 2, y = 1 (yes); x = 1, y = 2 (no). Not sufficient. Together: x^2 - y^2 = (x - y)(x + y) > 0 and x + y > 0, so x - y > 0. Sufficient. C.',
 wrong:'Factor the difference of squares; the sign of x + y unlocks the sign of x - y.'},
{id:'D106',section:'DI',type:'DS',domain:'math',skill:'di_ds',qskill:'q_csp',diff:4,
 stem:'List S consists of 5 positive integers. What is the median of S?\n\n(1) The average (arithmetic mean) of the integers in S is 20.\n(2) The greatest integer in S is 30 and the least is 10.',choices:DS_CHOICES,answer:4,
 expl:'(1) Mean 20 says nothing about the middle value alone. Not sufficient. (2) 10, ?, ?, ?, 30: the median can be anything from 10 to 30. Not sufficient. Together: sum 100 with 10 and 30 fixed leaves 60 for the three middle values: 15, 20, 25 (median 20) or 12, 18, 30 (median 18). Not sufficient. E.',
 wrong:'Mean and range constrain the middle values but do not fix them.'},
{id:'D107',section:'DI',type:'DS',domain:'math',skill:'di_ds',qskill:'q_rrp',diff:3,
 stem:'Machines A and B each work at a constant rate. Working alone, how many hours does Machine A take to complete one job?\n\n(1) Working together, Machines A and B complete the job in 6 hours.\n(2) Working alone, Machine A completes one-third of the job in 5 hours.',choices:DS_CHOICES,answer:1,
 expl:'(1) Combined time gives 1/A + 1/B = 1/6 with B unknown. Not sufficient. (2) One-third of the job in 5 hours means the whole job in 15 hours. Sufficient. B.',
 wrong:'Trap: assuming a two-machine problem needs both statements. Statement (2) is a complete rate fact on its own.'},
{id:'D108',section:'DI',type:'DS',domain:'math',skill:'di_ds',qskill:'q_alg',diff:2,
 stem:'What is the value of 2x + 3y?\n\n(1) 4x + 6y = 18\n(2) x + y = 4',choices:DS_CHOICES,answer:0,
 expl:'(1) Divide by 2: 2x + 3y = 9. Sufficient. (2) x = 4, y = 0 gives 8; x = 0, y = 4 gives 12. Not sufficient. A.',
 wrong:'You need the combination asked for, not the individual variables.'},
{id:'D109',section:'DI',type:'DS',domain:'nonmath',skill:'di_ds',diff:3,
 stem:'A permit committee approves an application if and only if the application is complete and at least two of the committee\'s three reviewers recommend approval. Was Application K approved?\n\n(1) Exactly one of the three reviewers recommended approval of Application K.\n(2) Application K was incomplete.',choices:DS_CHOICES,answer:3,
 expl:'(1) Only one recommendation, fewer than two, so the application was not approved. A definite "no" answers the question. Sufficient. (2) Incomplete applications are not approved. Definite "no." Sufficient. Each alone. D.',
 wrong:'Trap: treating a "No" answer as insufficient. Sufficiency means a definite answer, yes or no.'},
{id:'D110',section:'DI',type:'DS',domain:'nonmath',skill:'di_ds',diff:4,
 stem:'Each employee at a firm is assigned to exactly one of three teams: Red, Blue, or Green. Every employee on the Red team has completed safety training. Is Marta, an employee at the firm, on the Red team?\n\n(1) Marta has completed safety training.\n(2) Marta is not on the Blue team.',choices:DS_CHOICES,answer:4,
 expl:'(1) Red implies training, but training does not imply Red; a Green or Blue employee could be trained. Not sufficient. (2) Marta is Red or Green. Not sufficient. Together: a trained Green-team employee satisfies both statements, as does a Red-team employee. Not sufficient. E.',
 wrong:'Trap: reversing a conditional. "All Red are trained" is not "all trained are Red."'},

// ---- Graphics Interpretation (D111-D116) ----
{id:'D111',section:'DI',type:'GI',domain:'math',skill:'di_gt',qskill:'q_csp',diff:2,passageHtml:GI_CHART1,answerType:'gi',
 stem:'The bar chart shows annual rainfall at Station K for each year from 2019 to 2024. Complete each statement using the drop-down options.',

  {text:'The median annual rainfall for the six years shown was ____ mm.',options:['600','620','640','660'],answer:2}],
 expl:'Year-over-year changes: 2020 -80, 2021 +160, 2022 -40, 2023 -180, 2024 +270; the largest increase is 2024. Sorted values 480, 540, 620, 660, 700, 750; the median is (620 + 660)/2 = 640.',

{id:'D112',section:'DI',type:'GI',domain:'math',skill:'di_gt',qskill:'q_rrp',diff:3,passageHtml:GI_CHART1,answerType:'gi',
 stem:'The bar chart shows annual rainfall at Station K for each year from 2019 to 2024. Complete each statement using the drop-down options.',

{id:'D113',section:'DI',type:'GI',domain:'math',skill:'di_gt',qskill:'q_csp',diff:3,passageHtml:GI_CHART2,answerType:'gi',
 stem:'The line graph shows monthly revenue for Store A and Store B from January to June. Complete each statement using the drop-down options.',
 statements:[
  {text:'Store A\'s monthly revenue first exceeded Store B\'s in ____.',options:['March','April','May','June'],answer:0},
  {text:'Over the six months, Store A\'s total revenue was ____ Store B\'s total revenue.',options:['less than','equal to','greater than','exactly twice'],answer:0}],

{id:'D114',section:'DI',type:'GI',domain:'math',skill:'di_gt',qskill:'q_rrp',diff:4,passageHtml:GI_CHART2,answerType:'gi',
 stem:'The line graph shows monthly revenue for Store A and Store B from January to June. Complete each statement using the drop-down options.',

  {text:'The change in Store B\'s revenue from one month to the next was greatest in absolute value between ____.',options:['January and February','March and April','April and May','May and June'],answer:1}],

{id:'D115',section:'DI',type:'GI',domain:'math',skill:'di_gt',qskill:'q_rrp',diff:3,passageHtml:GI_CHART3,answerType:'gi',
 stem:'The scatter plot shows monthly advertising spend and monthly sales for eight stores, labeled A through H. Complete each statement using the drop-down options.',

{id:'D116',section:'DI',type:'GI',domain:'math',skill:'di_gt',qskill:'q_csp',diff:3,passageHtml:GI_CHART3,answerType:'gi',
 stem:'The scatter plot shows monthly advertising spend and monthly sales for eight stores, labeled A through H. Complete each statement using the drop-down options.',

  {text:'The median of the eight sales values is ____ thousand dollars.',options:['33','34','35','36'],answer:1}],
 expl:'Sales rise as spend rises, but not on a straight line (C is below B, G is below F): positive, not perfectly linear. Sorted sales: 20, 26, 28, 33, 35, 40, 44, 50; median (33 + 35)/2 = 34.',

{id:'D118',section:'DI',type:'TA',domain:'math',skill:'di_gt',qskill:'q_rrp',diff:4,passageHtml:TA_TABLE1,answerType:'ta',

{id:'D119',section:'DI',type:'TA',domain:'math',skill:'di_gt',qskill:'q_rrp',diff:3,passageHtml:TA_TABLE2,answerType:'ta',

{id:'D120',section:'DI',type:'TA',domain:'math',skill:'di_gt',qskill:'q_csp',diff:4,passageHtml:TA_TABLE2,answerType:'ta',

// ---- Two-Part Analysis (D123-D126) ----
{id:'D123',section:'DI',type:'TPA',domain:'math',skill:'di_tpa',qskill:'q_rrp',diff:4,answerType:'tpa',
 stem:'A wholesaler normally sells an item at a price 25 percent above its cost. During a sale, the wholesaler takes d percent off the normal selling price and still earns a profit equal to 10 percent of cost on each item. During the sale, the wholesaler sold 200 items for a total revenue of $8,800.\n\nSelect the value of d and the cost per item, in dollars. Make only two selections, one in each column.',
 columns:['Value of d','Cost per item ($)'],choices:['10','12','15','40','44','50'],answer:[1,3],
 expl:'Sale price = 1.10c and normal price = 1.25c, so (1 - d/100)(1.25) = 1.10, giving 1 - d/100 = 0.88 and d = 12. Sale price = 8,800/200 = 44 = 1.10c, so c = 40.',
 wrong:'Trap: computing d as 25 - 10 = 15. Percent markups do not subtract; the discount is on the marked-up price.'},
{id:'D124',section:'DI',type:'TPA',domain:'math',skill:'di_tpa',qskill:'q_csp',diff:4,answerType:'tpa',
 stem:'A committee of 3 people is to be selected from a group of 4 managers and 5 staff members.\n\nSelect the number of possible committees that include at least one manager, and the number of possible committees that include exactly two managers. Make only two selections, one in each column.',
 columns:['At least one manager','Exactly two managers'],choices:['30','40','60','74','80','84'],answer:[3,0],
 expl:'Total committees C(9,3) = 84. Committees with no manager: C(5,3) = 10, so at least one manager: 84 - 10 = 74. Exactly two managers: C(4,2) x C(5,1) = 6 x 5 = 30.',
 wrong:'Trap: counting "at least one" directly is slow; use the complement.'},
{id:'D125',section:'DI',type:'TPA',domain:'math',skill:'di_tpa',qskill:'q_alg',diff:5,answerType:'tpa',
 stem:'Pipe P alone fills a tank in p hours and Pipe Q alone fills the same tank in q hours, where p and q are positive integers. Working together at their constant rates, the two pipes fill the tank in 3 hours 45 minutes, and Pipe Q alone takes 4 hours longer than Pipe P alone.\n\nSelect the value of p and the value of q. Make only two selections, one in each column.',
 columns:['p','q'],choices:['4','5','6','10','12','15'],answer:[2,3],
 expl:'1/p + 1/q = 1/3.75 = 4/15. Candidates with integer p, q: (5, 15) and (6, 10). Only (6, 10) has q - p = 4. Check: 1/6 + 1/10 = 8/30 = 4/15.',
 wrong:'Trap: (5, 15) also satisfies the combined-rate equation; the "4 hours longer" condition selects (6, 10).'},
{id:'D126',section:'DI',type:'TPA',domain:'nonmath',skill:'di_tpa',diff:4,answerType:'tpa',
 stem:'City council member: Since the city installed automated speed cameras on Main Street last year, the number of traffic accidents on Main Street has fallen by 30 percent. Therefore, installing speed cameras on Oak Avenue will reduce accidents there as well.\n\nSelect the statement that, if true, most strengthens the council member\'s argument, and the statement that, if true, most weakens it. Make only two selections, one in each column.',
 columns:['Strengthens','Weakens'],
 choices:['Oak Avenue, like Main Street, is a four-lane road on which most accidents involve vehicles exceeding the speed limit.',
  'The speed cameras on Main Street cost the city about $120,000 each to install.',
  'The speed cameras on Main Street generated roughly $400,000 in fines last year.',
  'The council member who made the argument represents the district that contains Oak Avenue.',
  'Oak Avenue is scheduled to be resurfaced next year whether or not cameras are installed.',
  'Most accidents on Oak Avenue occur at a single intersection and involve drivers failing to yield rather than speeding.'],
 answer:[0,5],
 expl:'The argument is an analogy: cameras cut speeding-related accidents on Main Street, so they will on Oak Avenue. Statement 1 makes the two roads alike in the relevant respect (speeding causes accidents), strengthening. Statement 6 says Oak Avenue\'s accidents are not about speeding, so speed cameras would not address them, weakening. Cost, fines, the member\'s district, and resurfacing plans do not bear on whether cameras would reduce accidents.',
 wrong:'Trap: the fines statement feels like a criticism of the policy but says nothing about accident reduction.'},

// ---- Multi-Source Reasoning (D127-D130) ----
{id:'D127',section:'DI',type:'MSR',domain:'nonmath',skill:'di_msr',diff:3,passageHtml:MSR_SET2,
 stem:'Which of the five claims, as submitted, is ineligible for any reimbursement under the policy?',
 choices:['C1','C2','C3','C4','C5'],answer:1,
 expl:'C2 ended March 10 and was submitted April 15, 36 days later, beyond the 30-day window; the email confirms no exceptions. C1 (17 days), C3 (14), C4 (12), and C5 (16) are all within 30 days.'},
{id:'D128',section:'DI',type:'MSR',domain:'math',skill:'di_msr',qskill:'q_rrp',diff:4,passageHtml:MSR_SET2,
 stem:'Based on the policy and the director\'s email, what is the total reimbursable amount for Claim C5?',
 choices:['$1,490','$1,550','$1,610','$1,670','$1,730'],answer:2,
 expl:'Airfare $530 (economy, full) + lodging 4 x $180 = $720 (within either cap) + meals 5 x $60 = $300 + mileage 100 x $0.60 = $60. Total $1,610.',
 wrong:'Trap: forgetting the per diem, which is paid without receipts, or the mileage.'},
{id:'D129',section:'DI',type:'MSR',domain:'math',skill:'di_msr',qskill:'q_rrp',diff:4,passageHtml:MSR_SET2,
 stem:'The reimbursable total for Claim C3 exceeds the $2,000 sign-off threshold by how much?',
 choices:['$580','$680','$700','$740','$1,340'],answer:3,
 expl:'The 8-hour business-class flight qualifies for full reimbursement, $1,900. The trip ended March 14, before the new cap, but the director pre-approved the overage, so lodging is 3 x $200 = $600. Meals 4 x $60 = $240. Total $2,740, which is $740 over $2,000.',
 wrong:'Trap: $680 comes from capping lodging at $180 despite the pre-approval; $1,340 comes from capping the long-haul business fare at $500.'},
{id:'D130',section:'DI',type:'MSR',domain:'nonmath',skill:'di_msr',diff:4,passageHtml:MSR_SET2,
 stem:'Which of the following statements is supported by the information in the three tabs?',
 choices:['Exactly one of the five claims requires the director\'s sign-off before it can be paid.',
  'Claim C5\'s lodging would have exceeded the cap in effect before March 15.',
  'Claim C4\'s business-class airfare is reimbursed in full because the trip ended after March 15.',
  'Claim C1 would have been reimbursed a greater amount if the trip had ended after March 15.',
  'Claim C2 will be paid on Friday when the director reviews the queue.'],answer:0,
 expl:'Only C3 ($2,740) exceeds $2,000; C1 ($940), C4 ($831), and C5 ($1,610) do not, and C2 is ineligible. A is supported. C5 lodging is $180 per night, equal to the old cap, not above it. C4\'s 3-hour business flight is capped at $500 regardless of date. C1\'s $170 nights are under both caps, so nothing changes. C2 is late and is not in the sign-off queue.',
 wrong:'Trap in C: the email changes only the lodging cap, not the airfare rule.'}
];

// Flashcard deck: formulas, rules and strategy prompts. front = prompt, back = answer. sec: Q | V | DI | G (general/pacing)
const CARDS = [
{id:'c001',sec:'Q',skill:'q_rrp',front:'Percent change formula',back:'(new - old) / old x 100%. The base is always the ORIGINAL value.'},
{id:'c002',sec:'Q',skill:'q_rrp',front:'Successive percent changes of +a% then -b%',back:'Multiply the factors: (1 + a/100)(1 - b/100). +20% then -20% = 1.2 x 0.8 = 0.96, a 4% net decrease.'},
{id:'c003',sec:'Q',skill:'q_rrp',front:'Combined work rate for two machines taking a and b hours alone',back:'Add rates: 1/a + 1/b = 1/T, so T = ab/(a + b). Always less than the faster time.'},
{id:'c004',sec:'Q',skill:'q_rrp',front:'Average speed over a trip',back:'Total distance / total time. Never the average of the two speeds unless the times are equal.'},
{id:'c005',sec:'Q',skill:'q_rrp',front:'Ratio multiplier method',back:'If a:b = 3:4, write a = 3k and b = 4k. Any total, difference, or single value pins down k.'},
{id:'c006',sec:'Q',skill:'q_rrp',front:'Mixture setup (concentrations)',back:'Track the pure ingredient: (pure before + pure added) / (total before + total added) = target concentration.'},
{id:'c007',sec:'Q',skill:'q_rrp',front:'Simple vs compound interest',back:'Simple: I = P x r x t. Compound: A = P(1 + r/n)^(nt). Compound exceeds simple after the first period.'},
{id:'c008',sec:'Q',skill:'q_rrp',front:'"x is what percent greater than y" vs "x is what percent of y"',back:'Greater than: (x - y)/y. Of: x/y. Different questions, different answers.'},
{id:'c009',sec:'Q',skill:'q_vof',front:'Number of positive divisors of N',back:'Prime factorize N = p^a x q^b x ... The count is (a+1)(b+1)... For 72 = 2^3 x 3^2: 4 x 3 = 12.'},
{id:'c010',sec:'Q',skill:'q_vof',front:'LCM and GCF from prime factorizations',back:'LCM takes the highest power of each prime; GCF takes the lowest. LCM x GCF = a x b.'},
{id:'c011',sec:'Q',skill:'q_vof',front:'Remainder of a^n divided by m',back:'Reduce a mod m, then find the cycle of powers mod m. 7^25 mod 5: 7 = 2 mod 5; 2, 4, 3, 1 repeats every 4; 25 = 24 + 1, remainder 2.'},
{id:'c012',sec:'Q',skill:'q_vof',front:'When does a fraction terminate as a decimal?',back:'In lowest terms, only if the denominator has no prime factors other than 2 and 5.'},
{id:'c013',sec:'Q',skill:'q_vof',front:'If n^2 is divisible by p^k, what must divide n?',back:'p^(ceil(k/2)). n^2 divisible by 2^3 forces n divisible by 2^2.'},
{id:'c014',sec:'Q',skill:'q_vof',front:'Even/odd rules',back:'even +- even = even; odd +- odd = even; even +- odd = odd; product is odd only if all factors are odd.'},
{id:'c015',sec:'Q',skill:'q_vof',front:'Comparing fractions quickly',back:'Cross-multiply pairs, or convert to decimals to 3 places. Do not eyeball.'},
{id:'c016',sec:'Q',skill:'q_alg',front:'Translate: "3 more than twice a number"',back:'2x + 3. Order of the words matters: "twice (3 more than a number)" is 2(x + 3).'},
{id:'c017',sec:'Q',skill:'q_alg',front:'When does an inequality flip?',back:'When you multiply or divide both sides by a negative. Never multiply by a variable of unknown sign.'},
{id:'c018',sec:'Q',skill:'q_alg',front:'|expression| < k and |expression| > k',back:'< k: -k < expr < k (a band). > k: expr > k OR expr < -k (two rays).'},
{id:'c019',sec:'Q',skill:'q_alg',front:'Discriminant b^2 - 4ac tells you...',back:'> 0: two real roots; = 0: one real root (perfect square); < 0: no real roots.'},
{id:'c020',sec:'Q',skill:'q_alg',front:'Three special products to recognize on sight',back:'(a+b)^2 = a^2 + 2ab + b^2; (a-b)^2 = a^2 - 2ab + b^2; (a+b)(a-b) = a^2 - b^2.'},
{id:'c021',sec:'Q',skill:'q_alg',front:'x + 1/x = 3. What is x^2 + 1/x^2?',back:'Square both sides: x^2 + 2 + 1/x^2 = 9, so x^2 + 1/x^2 = 7. Do not forget the cross term.'},
{id:'c022',sec:'Q',skill:'q_alg',front:'Two equations, two unknowns: when is there NO unique solution?',back:'When one equation is a multiple of the other (same line) or they are parallel. Check independence before trusting "two equations".'},
{id:'c023',sec:'Q',skill:'q_alg',front:'Exponent rules',back:'a^m x a^n = a^(m+n); (a^m)^n = a^(mn); a^m / a^n = a^(m-n); a^0 = 1; a^(-n) = 1/a^n.'},
{id:'c024',sec:'Q',skill:'q_alg',front:'Back-solving: where to start?',back:'Start with B or D (choices are usually ascending). The result tells you which direction to move, so you test at most two more.'},
{id:'c025',sec:'Q',skill:'q_csp',front:'Permutations vs combinations',back:'Order matters: nPr = n!/(n-r)!. Order does not matter: nCr = n!/(r!(n-r)!). Committees are combinations; rankings are permutations.'},
{id:'c026',sec:'Q',skill:'q_csp',front:'"A and B must sit together" in a row of n',back:'Glue A and B into one unit: (n-1)! arrangements x 2 for their internal order.'},
{id:'c027',sec:'Q',skill:'q_csp',front:'P(at least one)',back:'1 - P(none). Almost always faster than adding cases.'},
{id:'c028',sec:'Q',skill:'q_csp',front:'Two overlapping sets formula',back:'Total = A + B - Both + Neither. Subtract "neither" first when it is given.'},
{id:'c029',sec:'Q',skill:'q_csp',front:'Sum of an arithmetic sequence',back:'n x (first + last) / 2. The n-th term is a1 + (n-1)d.'},
{id:'c030',sec:'Q',skill:'q_csp',front:'Mean vs median in a skewed set',back:'The mean is pulled toward the tail (outliers); the median resists. Evenly spaced sets: mean = median = (first + last)/2.'},
{id:'c031',sec:'Q',skill:'q_csp',front:'Standard deviation: what changes it?',back:'Adding a constant to every term: unchanged. Multiplying every term by c: SD multiplies by |c|. Values closer to the mean lower it.'},
{id:'c032',sec:'Q',skill:'q_csp',front:'Averages: first move',back:'Convert to sums. Sum = average x count. Then add, remove, or replace terms with sums.'},
{id:'c033',sec:'V',skill:'v_ac',front:'First step on every Critical Reasoning item',back:'Find the conclusion (therefore, thus, clearly, should). Then the evidence. The gap between them is where the answer lives.'},
{id:'c034',sec:'V',skill:'v_ac',front:'Assumption negation test',back:'Negate the choice. If the argument collapses, that choice is a necessary assumption. If the argument survives, it is not.'},
{id:'c035',sec:'V',skill:'v_ac',front:'Three classic weakeners for a causal claim',back:'Reverse causation, a third factor causing both, or an unrepresentative sample / coincidence.'},
{id:'c036',sec:'V',skill:'v_ac',front:'Evaluate questions: what does the right answer look like?',back:'A question whose YES and NO answers push the conclusion in opposite directions. If both answers leave the argument unchanged, eliminate.'},
{id:'c037',sec:'V',skill:'v_ac',front:'Boldface method',back:'Label every sentence (conclusion, premise, opposing view, background) BEFORE reading the choices. Then match roles, not content.'},
{id:'c038',sec:'V',skill:'v_pc',front:'Paradox / resolve the discrepancy',back:'The right answer makes both facts true at once. Never pick a choice that denies one of the facts.'},
{id:'c039',sec:'V',skill:'v_pc',front:'Plan questions: two things to separate',back:'The goal and the mechanism. A plan fails when the mechanism does not reach the goal or when people respond in ways that defeat it.'},
{id:'c040',sec:'V',skill:'v_pc',front:'Inference / must-be-true standard',back:'Must follow from the text, not merely be likely. Prefer the modest answer over the interesting one. Extreme words are red flags.'},
{id:'c041',sec:'V',skill:'v_st',front:'RC passage map',back:'One phrase per paragraph stating its JOB (raises a view, rejects it, offers an alternative, handles an objection). Read for structure, not memory.'},
{id:'c042',sec:'V',skill:'v_st',front:'Main idea traps',back:'Too narrow (one paragraph), too broad, or the author\'s stance reversed. The answer covers the whole map.'},
{id:'c043',sec:'V',skill:'v_st',front:'Detail questions: correct vs trap',back:'Correct answers paraphrase the text. Traps reuse the passage\'s exact words with a twisted meaning.'},
{id:'c044',sec:'V',skill:'v_inf',front:'"In order to" (function) questions',back:'Describe the ROLE the sentence plays in the argument (concede then rebut, illustrate, qualify), not its content.'},
{id:'c045',sec:'V',skill:'v_st',front:'RC time budget',back:'3 to 4 minutes to read and map, then about 1 minute per question. Long passage set: 6 to 8 minutes total.'},
{id:'c046',sec:'DI',skill:'di_ds',front:'Data Sufficiency answer choices',back:'A: (1) alone. B: (2) alone. C: together only. D: each alone. E: neither, even together.'},
{id:'c047',sec:'DI',skill:'di_ds',front:'AD / BCE grid',back:'Test (1) alone. Sufficient: answer is A or D. Not: B, C, or E. Then test (2) alone. Combine only if both fail alone.'},
{id:'c048',sec:'DI',skill:'di_ds',front:'What does "sufficient" mean for a value question vs a yes/no question?',back:'Value: exactly one value. Yes/no: a definite answer either way; a consistent NO is sufficient.'},
{id:'c049',sec:'DI',skill:'di_ds',front:'Numbers to test in DS',back:'0, 1, negatives, fractions between 0 and 1. Squares hide negatives; products hide zero.'},
{id:'c050',sec:'DI',skill:'di_ds',front:'The two cardinal DS sins',back:'Carrying information from statement (1) into (2), and solving fully instead of testing sufficiency.'},
{id:'c051',sec:'DI',skill:'di_gt',front:'Graphs and tables: first 10 seconds',back:'Title, axes, units, legend, footnotes. Most misses are unit misses (thousands vs units, percent vs percentage points).'},
{id:'c052',sec:'DI',skill:'di_gt',front:'Largest increase vs largest percent increase',back:'Different questions. The tallest bar is not necessarily the largest percent change; divide by the starting value.'},
{id:'c053',sec:'DI',skill:'di_gt',front:'Table Analysis method',back:'Sort by the column the statement is about, verify each statement independently, and watch for totals rows and rounding.'},
{id:'c054',sec:'DI',skill:'di_gt',front:'Graphics Interpretation dropdowns',back:'Read every option before choosing; the options tell you what the statement is testing (percent vs number, slope vs value).'},
{id:'c055',sec:'DI',skill:'di_msr',front:'Multi-Source Reasoning approach',back:'Skim each tab for what it contains, then answer-driven reading. Test each request against every condition; do not stop at the first satisfied rule.'},
{id:'c056',sec:'DI',skill:'di_tpa',front:'Two-Part Analysis: linked vs independent columns',back:'Linked: one system of equations, solve once, place both answers. Independent: solve each column separately. The same value can appear in both.'},
{id:'c057',sec:'DI',skill:'di_gt',front:'When to use the on-screen calculator',back:'Only in Data Insights, only for the final arithmetic. Estimate first; the answer choices are usually spread.'},
{id:'c058',sec:'G',skill:'pacing',front:'Section pace per question',back:'Quant 2:08 (21 Q / 45 min). Verbal 1:57 (23 Q / 45 min). Data Insights 2:15 (20 Q / 45 min).'},
{id:'c059',sec:'G',skill:'pacing',front:'Bail rule',back:'No method after 60 to 75 seconds: pick the best remaining choice, bookmark, move on. Slow-and-wrong costs twice.'},
{id:'c060',sec:'G',skill:'pacing',front:'Review and edit rules (Focus Edition)',back:'Bookmark any question; at the end of each section change up to 3 answers if time remains. Reserve 3 to 5 minutes; do not re-solve from scratch.'},
{id:'c061',sec:'G',skill:'pacing',front:'Score scale',back:'Total 205 to 805 in 10-point steps. Each section 60 to 90. Sections weighted equally. Focus 645 is roughly the old 700.'},
{id:'c062',sec:'G',skill:'pacing',front:'Never leave a question blank because...',back:'Unanswered questions hurt more than wrong ones in the adaptive scoring. Guess and move.'}
];
