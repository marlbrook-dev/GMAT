const SUPABASE_URL="https://ftsqwbzhkzuudogkvoqa.supabase.co", SUPABASE_KEY="sb_publishable_GToT4fK6RiwCZpPFE3bGiw_ThXq9qel", APP_VERSION="0.3.0";
// Quant seed bank. Fields: id, section, type, domain, context, skill, diff, stem, choices, answer (index), expl, wrong (optional notes on traps)
const BANK_QUANT = [
{id:'Q001',section:'Q',type:'PS',domain:'arithmetic',context:'real',skill:'q_rrp',diff:2,
 stem:'A store marks up the cost of a jacket by 40% to set its list price, then sells the jacket at a 15% discount off the list price. The store\'s profit is what percent of the cost of the jacket?',
 choices:['15%','19%','21%','25%','40%'],answer:1,
 expl:'Pick cost = 100. List price = 140. Selling price = 140 x 0.85 = 119. Profit = 19, which is 19% of cost.',
 wrong:'A (15%) and D (25%) come from adding or subtracting the percentages directly. Successive percent changes multiply; they never simply add.'},
{id:'Q002',section:'Q',type:'PS',domain:'arithmetic',context:'real',skill:'q_rrp',diff:3,
 stem:'Machine A can complete a job in 6 hours and Machine B can complete the same job in 9 hours. Working together at their constant rates, how long will the two machines take to complete the job?',
 choices:['3 hours 12 minutes','3 hours 36 minutes','4 hours','4 hours 30 minutes','7 hours 30 minutes'],answer:1,
 expl:'Rates add: 1/6 + 1/9 = 3/18 + 2/18 = 5/18 job per hour. Time = 18/5 = 3.6 hours = 3 hours 36 minutes.',
 wrong:'E (7.5) is the average of the two times, a classic trap. Combined time must be less than the faster machine alone (6 hours), which eliminates C, D, E instantly.'},
{id:'Q003',section:'Q',type:'PS',domain:'algebra',context:'real',skill:'q_rrp',diff:3,
 stem:'A train travels 180 miles at a constant speed of v miles per hour. If the train had traveled 15 miles per hour faster, the trip would have taken 1 hour less. What is v?',
 choices:['30','36','45','60','75'],answer:2,
 expl:'180/v - 180/(v+15) = 1. Multiply out: 180(v+15) - 180v = v(v+15), so 2700 = v^2 + 15v, so v^2 + 15v - 2700 = 0, (v-45)(v+60)=0, v = 45. Faster: back-solve. Try C: 180/45 = 4 h; 180/60 = 3 h. Difference 1 h. Done.',
 wrong:'Back-solving from the answer choices is faster than the quadratic here. Start with the middle choice.'},
{id:'Q004',section:'Q',type:'PS',domain:'arithmetic',context:'pure',skill:'q_rrp',diff:2,
 stem:'If 30 percent of x equals 45 percent of y, and x and y are positive, what is the ratio of x to y?',
 choices:['2:3','3:2','3:5','5:3','9:4'],answer:1,
 expl:'0.30x = 0.45y, so x/y = 0.45/0.30 = 3/2. Ratio 3:2.',
 wrong:'A (2:3) is the reversed ratio. Since x needs a smaller percent to match y, x must be the larger number.'},
{id:'Q005',section:'Q',type:'PS',domain:'algebra',context:'real',skill:'q_rrp',diff:4,
 stem:'A 40-liter solution is 25% acid. How many liters of pure acid must be added so that the resulting solution is 40% acid?',
 choices:['6','8','10','12','15'],answer:2,
 expl:'Acid now = 10 L. Add x liters of pure acid: (10 + x)/(40 + x) = 0.4, so 10 + x = 16 + 0.4x, so 0.6x = 6, x = 10.',
 wrong:'A (6) comes from 15% of 40, forgetting the added acid also increases total volume.'},
{id:'Q006',section:'Q',type:'PS',domain:'arithmetic',context:'real',skill:'q_rrp',diff:3,
 stem:'A town\'s population increased by 20% during one year and then decreased by 20% during the following year. Compared with its size at the start of the two-year period, the population at the end was',
 choices:['unchanged','2% smaller','4% smaller','4% larger','8% smaller'],answer:2,
 expl:'1.20 x 0.80 = 0.96, a 4% decrease. Up-then-down by the same percent always ends below the start.',
 wrong:'A (unchanged) is the intuitive trap; percent changes are taken from different bases.'},
{id:'Q007',section:'Q',type:'PS',domain:'arithmetic',context:'pure',skill:'q_vof',diff:2,
 stem:'How many positive divisors does 72 have?',
 choices:['8','10','12','16','18'],answer:2,
 expl:'72 = 2^3 x 3^2. Number of divisors = (3+1)(2+1) = 12.',
 wrong:'Listing divisors by hand risks missing one; use the exponent-plus-one formula.'},
{id:'Q008',section:'Q',type:'PS',domain:'arithmetic',context:'pure',skill:'q_vof',diff:3,
 stem:'What is the remainder when 7^25 is divided by 5?',
 choices:['0','1','2','3','4'],answer:2,
 expl:'7 leaves remainder 2 when divided by 5, so look at powers of 2 mod 5: 2, 4, 3, 1, then repeats every 4. 25 = 24 + 1, so 7^25 behaves like 2^1: remainder 2.',
 wrong:'Units-digit patterns (7, 9, 3, 1) give the remainder mod 10, not mod 5; here they still work (units digit of 7^25 is 7, and 7 mod 5 = 2) but the cycle method is the general tool.'},
{id:'Q009',section:'Q',type:'PS',domain:'arithmetic',context:'pure',skill:'q_vof',diff:3,
 stem:'If n is a positive integer and n^2 is divisible by 72, what is the largest positive integer that must divide n?',
 choices:['6','12','24','36','48'],answer:1,
 expl:'72 = 2^3 x 3^2. For n^2 to contain 2^3, n must contain 2^2 (since exponents in n^2 are even and at least 3). For 3^2, n needs 3^1. So n must be divisible by 4 x 3 = 12.',
 wrong:'D (36) treats n as if it must be divisible by 72 itself; only n^2 must be.'},
{id:'Q010',section:'Q',type:'PS',domain:'arithmetic',context:'real',skill:'q_vof',diff:2,
 stem:'The sum of five consecutive integers is 85. What is the largest of the five integers?',
 choices:['17','18','19','20','21'],answer:2,
 expl:'The average of consecutive integers is the middle term: 85/5 = 17. The set is 15, 16, 17, 18, 19. Largest = 19.',
 wrong:'A (17) is the middle term, not the largest.'},
{id:'Q011',section:'Q',type:'PS',domain:'arithmetic',context:'pure',skill:'q_vof',diff:4,
 stem:'What is the least common multiple of 84 and 126?',
 choices:['168','252','336','504','10,584'],answer:1,
 expl:'84 = 2^2 x 3 x 7; 126 = 2 x 3^2 x 7. LCM takes the highest power of each prime: 2^2 x 3^2 x 7 = 252.',
 wrong:'E (10,584) is the product 84 x 126, which is the LCM only when the numbers share no factors.'},
{id:'Q012',section:'Q',type:'PS',domain:'arithmetic',context:'pure',skill:'q_vof',diff:2,
 stem:'Which of the following has the greatest value?',
 choices:['2/3','0.66','5/8','0.67','13/20'],answer:3,
 expl:'Convert to decimals: 2/3 = 0.6667, 5/8 = 0.625, 13/20 = 0.65. The largest is 0.67.',
 wrong:'A (2/3 = 0.6667) is very close but 0.67 is slightly larger.'},
{id:'Q013',section:'Q',type:'PS',domain:'algebra',context:'pure',skill:'q_alg',diff:1,
 stem:'If 3x - 7 = 2x + 5, what is the value of x?',
 choices:['2','5','7','12','14'],answer:3,
 expl:'Subtract 2x from both sides: x - 7 = 5, so x = 12.'},
{id:'Q014',section:'Q',type:'PS',domain:'algebra',context:'pure',skill:'q_alg',diff:3,
 stem:'If x^2 - 5x + 6 = 0 and x^2 - 4 = 0, what is the value of x?',
 choices:['-2','2','3','2 or 3','-2 or 2'],answer:1,
 expl:'First equation: (x-2)(x-3)=0, so x = 2 or 3. Second: x = 2 or -2. Both must hold, so x = 2.',
 wrong:'D and E each satisfy only one equation.'},
{id:'Q015',section:'Q',type:'PS',domain:'algebra',context:'pure',skill:'q_alg',diff:3,
 stem:'If |2x - 3| < 7, which of the following describes all possible values of x?',
 choices:['-5 < x < 2','-2 < x < 5','x < -2 or x > 5','-7 < x < 7','2 < x < 5'],answer:1,
 expl:'-7 < 2x - 3 < 7, add 3: -4 < 2x < 10, divide by 2: -2 < x < 5.',
 wrong:'C is the solution to |2x-3| > 7 (the outside region).'},
{id:'Q016',section:'Q',type:'PS',domain:'algebra',context:'pure',skill:'q_alg',diff:4,
 stem:'If x > 0 and x^2 + 1/x^2 = 7, what is the value of x + 1/x?',
 choices:['sqrt(5)','3','sqrt(7)','5','9'],answer:1,
 expl:'(x + 1/x)^2 = x^2 + 2 + 1/x^2 = 7 + 2 = 9, so x + 1/x = 3 (positive since x > 0).',
 wrong:'C (sqrt 7) forgets the cross term 2 when squaring.'},
{id:'Q017',section:'Q',type:'PS',domain:'algebra',context:'real',skill:'q_alg',diff:3,
 stem:'A theater sold 50 tickets for a total of $520. Adult tickets cost $12 and child tickets cost $8. How many adult tickets were sold?',
 choices:['20','25','30','35','40'],answer:2,
 expl:'Let a = adults. 12a + 8(50 - a) = 520, so 4a + 400 = 520, a = 30. Check: 30 x 12 + 20 x 8 = 360 + 160 = 520.',
 wrong:'Back-solving works: try C first, it checks.'},
{id:'Q018',section:'Q',type:'PS',domain:'algebra',context:'real',skill:'q_alg',diff:3,
 stem:'The length of a rectangle is 3 more than twice its width. If the perimeter is 36, what is the area of the rectangle?',
 choices:['40','55','65','78','91'],answer:2,
 expl:'Let width = w, length = 2w + 3. Perimeter: 2(w + 2w + 3) = 36, so 3w + 3 = 18, w = 5, length = 13. Area = 65.',
 wrong:'Translate each phrase in order: "3 more than twice the width" is 2w + 3, not 2(w + 3).'},
{id:'Q019',section:'Q',type:'PS',domain:'algebra',context:'pure',skill:'q_alg',diff:3,
 stem:'If a/b = 3/4 and a + b = 28, what is the value of b - a?',
 choices:['2','4','6','8','12'],answer:1,
 expl:'a = 3k, b = 4k, so 7k = 28, k = 4. a = 12, b = 16, b - a = 4.',
 wrong:'Ratio multiplier method: write both quantities in terms of one variable k.'},
{id:'Q020',section:'Q',type:'PS',domain:'algebra',context:'pure',skill:'q_alg',diff:4,
 stem:'For which values of k does the equation x^2 + kx + 9 = 0 have exactly one real solution?',
 choices:['3 only','6 only','-6 or 6','-3 or 3','9 only'],answer:2,
 expl:'One real solution means the discriminant is zero: k^2 - 4(1)(9) = 0, so k^2 = 36, k = 6 or -6. (Perfect squares (x+3)^2 and (x-3)^2.)',
 wrong:'B forgets the negative root; k = -6 gives (x - 3)^2.'},
{id:'Q021',section:'Q',type:'PS',domain:'algebra',context:'real',skill:'q_alg',diff:4,
 stem:'Ana is now 25 years old. In 5 years, Ana will be twice as old as Ben was 3 years ago. How old is Ben now?',
 choices:['12','15','18','21','24'],answer:2,
 expl:'Ana in 5 years = 30. Ben 3 years ago = B - 3. 30 = 2(B - 3), so B - 3 = 15, B = 18.',
 wrong:'Anchor each phrase to "now" before writing the equation; age problems fail on time-frame slips, not arithmetic.'},
{id:'Q022',section:'Q',type:'PS',domain:'algebra',context:'pure',skill:'q_alg',diff:3,
 stem:'If 2^(x+2) = 64, what is the value of x?',
 choices:['3','4','5','6','8'],answer:1,
 expl:'64 = 2^6, so x + 2 = 6, x = 4.',
 wrong:'D (6) forgets the +2 in the exponent.'},
{id:'Q023',section:'Q',type:'PS',domain:'arithmetic',context:'pure',skill:'q_csp',diff:3,
 stem:'How many different committees of 3 people can be chosen from a group of 7 people?',
 choices:['21','35','42','210','343'],answer:1,
 expl:'Order does not matter: C(7,3) = 7!/(3!4!) = 35.',
 wrong:'D (210) is the permutation count 7 x 6 x 5; committees are unordered so divide by 3! = 6.'},
{id:'Q024',section:'Q',type:'PS',domain:'arithmetic',context:'real',skill:'q_csp',diff:4,
 stem:'Five people are to be seated in a row of five chairs. If two particular people insist on sitting next to each other, in how many different orders can the five people be seated?',
 choices:['24','48','72','96','120'],answer:1,
 expl:'Glue the pair into one unit: 4 units can be arranged 4! = 24 ways, and the pair can be ordered within its unit 2 ways. 24 x 2 = 48.',
 wrong:'A (24) forgets to multiply by 2 for the internal order of the pair; E (120) is the unrestricted count.'},
{id:'Q025',section:'Q',type:'PS',domain:'arithmetic',context:'real',skill:'q_csp',diff:3,
 stem:'A bag contains 4 red marbles and 6 blue marbles. If two marbles are drawn at random without replacement, what is the probability that both are red?',
 choices:['2/15','4/25','1/5','2/9','4/15'],answer:0,
 expl:'P = 4/10 x 3/9 = 12/90 = 2/15.',
 wrong:'B (4/25) is the with-replacement answer 4/10 x 4/10.'},
{id:'Q026',section:'Q',type:'PS',domain:'arithmetic',context:'real',skill:'q_csp',diff:4,
 stem:'In a class of 30 students, 18 study French, 15 study Spanish, and 5 study neither language. How many students study both French and Spanish?',
 choices:['3','5','8','10','13'],answer:2,
 expl:'Students studying at least one language = 30 - 5 = 25. Then 18 + 15 - both = 25, so both = 8.',
 wrong:'A (3) forgets to subtract the "neither" group first: 18 + 15 - 30 = 3 is wrong because 30 includes the 5 who study neither.'},
{id:'Q027',section:'Q',type:'PS',domain:'arithmetic',context:'pure',skill:'q_csp',diff:3,
 stem:'For the set {3, 7, 8, 12, 15}, what is the mean minus the median?',
 choices:['0','1','2','3','4'],answer:1,
 expl:'Mean = 45/5 = 9. Median (middle value) = 8. Difference = 1.'},
{id:'Q028',section:'Q',type:'PS',domain:'arithmetic',context:'real',skill:'q_csp',diff:3,
 stem:'The average (arithmetic mean) of 5 numbers is 20. When one of the numbers is removed, the average of the remaining 4 numbers is 18. What number was removed?',
 choices:['20','24','26','28','32'],answer:3,
 expl:'Total of 5 = 100. Total of remaining 4 = 72. Removed = 100 - 72 = 28.',
 wrong:'Always convert averages to sums first; averages themselves cannot be subtracted.'},
{id:'Q029',section:'Q',type:'PS',domain:'algebra',context:'pure',skill:'q_csp',diff:4,
 stem:'In an arithmetic sequence, the first term is 5 and the tenth term is 41. What is the sum of the first 10 terms?',
 choices:['205','230','250','410','460'],answer:1,
 expl:'Sum = (number of terms) x (first + last)/2 = 10 x (5 + 41)/2 = 10 x 23 = 230. (Common difference 4 is not even needed.)',
 wrong:'E (460) forgets to divide by 2 (it uses first + last instead of their average).'},
{id:'Q030',section:'Q',type:'PS',domain:'arithmetic',context:'real',skill:'q_csp',diff:5,
 stem:'A fair coin is tossed 4 times. What is the probability of getting at least 3 heads?',
 choices:['1/16','1/4','5/16','3/8','1/2'],answer:2,
 expl:'Exactly 3 heads: C(4,3) = 4 outcomes. Exactly 4 heads: 1 outcome. Total favorable = 5 out of 16. P = 5/16.',
 wrong:'B (1/4) counts only exactly 3 heads; "at least" includes 4.'},
{id:'Q031',section:'Q',type:'PS',domain:'arithmetic',context:'real',skill:'q_rrp',diff:4,
 stem:'A car gets 30 miles per gallon on the highway and 20 miles per gallon in the city. On a 300-mile trip, 180 miles were on the highway and 120 miles were in the city. What was the car\'s average fuel efficiency for the whole trip, in miles per gallon?',
 choices:['24','25','26','27','28'],answer:1,
 expl:'Gas used = 180/30 + 120/20 = 6 + 6 = 12 gallons. Average = 300/12 = 25 mpg.',
 wrong:'C (26) is the mileage-weighted average of the rates, which is wrong: average rate = total distance / total gas, always.'},
{id:'Q032',section:'Q',type:'PS',domain:'arithmetic',context:'real',skill:'q_rrp',diff:2,
 stem:'A recipe calls for flour and sugar in the ratio 5:2. If a baker uses 21 cups of flour and sugar combined, how many cups of sugar are used?',
 choices:['4','5','6','7','15'],answer:2,
 expl:'Total parts = 7, each part = 3 cups. Sugar = 2 x 3 = 6 cups.',
 wrong:'E (15) is the flour amount.'}
];

// Quant bank 2 (original items). Fields: id, section, type, domain, context, skill, diff, stem, choices, answer (index), expl, wrong (optional)
const BANK_QUANT2 = [
// ---------- q_rrp (12) ----------
{id:'Q101',section:'Q',type:'PS',domain:'arithmetic',context:'real',skill:'q_rrp',diff:2,
 stem:'Working alone, Priya can mow a certain lawn in 45 minutes, and working alone her brother Dev can mow the same lawn in 90 minutes. If they work together at their constant rates, how many minutes will it take them to mow the lawn?',
 choices:['22.5','27','30','45','67.5'],answer:2,
 expl:'Rates add: 1/45 + 1/90 = 2/90 + 1/90 = 3/90 = 1/30 lawn per minute. Time = 30 minutes.',
 wrong:'E (67.5) is the average of the two times. Together must be faster than the faster worker alone (45), which kills D and E immediately.'},
{id:'Q102',section:'Q',type:'PS',domain:'arithmetic',context:'real',skill:'q_rrp',diff:3,
 stem:'The price of a share of Corvane Ltd rose 25% in January, fell 20% in February, and then rose 10% in March. The price at the end of March was what percent greater than the price at the start of January?',
 choices:['5%','8%','10%','12%','15%'],answer:2,
 expl:'Multiply the factors: 1.25 x 0.80 x 1.10 = 1.00 x 1.10 = 1.10, a 10% overall increase. Start at 100: 125, then 100, then 110.',
 wrong:'E (15%) adds the percents (25 - 20 + 10). Successive percent changes multiply.'},
{id:'Q103',section:'Q',type:'PS',domain:'arithmetic',context:'real',skill:'q_rrp',diff:3,
 stem:'A cyclist rides 24 kilometers up a hill at a constant speed of 12 kilometers per hour and then rides back down the same 24 kilometers at a constant speed of 24 kilometers per hour. What is the cyclist\'s average speed, in kilometers per hour, for the round trip?',
 choices:['16','17','18','20','21'],answer:0,
 expl:'Uphill time = 24/12 = 2 h; downhill time = 24/24 = 1 h. Total distance 48 km in 3 h, so average speed = 48/3 = 16 km/h.',
 wrong:'C (18) is the simple average of the two speeds. More time is spent at the slower speed, so the average is pulled below 18.'},
{id:'Q104',section:'Q',type:'PS',domain:'algebra',context:'real',skill:'q_rrp',diff:3,
 stem:'A grocer has 30 kilograms of a trail mix that is 20% cashews by weight. How many kilograms of a second trail mix that is 50% cashews by weight must be added so that the combined mix is 30% cashews?',
 choices:['6','9','12','15','18'],answer:3,
 expl:'Cashews now: 0.20 x 30 = 6 kg. Add x kg of 50% mix: (6 + 0.5x)/(30 + x) = 0.30, so 6 + 0.5x = 9 + 0.3x, so 0.2x = 3, x = 15.',
 wrong:'Alligation check: distances from 30% are 10 (to 20%) and 20 (to 50%), so the ratio of 20% mix to 50% mix is 2:1, i.e., 30:15.'},
{id:'Q105',section:'Q',type:'PS',domain:'arithmetic',context:'real',skill:'q_rrp',diff:3,
 stem:'At an investment firm, the ratio of analysts to associates is 5 to 2, and the ratio of associates to vice presidents is 3 to 1. If the firm has 12 vice presidents, how many analysts, associates, and vice presidents does it have in total?',
 choices:['138','161','184','207','230'],answer:0,
 expl:'Combine ratios through associates: analysts:associates = 15:6 and associates:VPs = 6:2, so analysts:associates:VPs = 15:6:2. VPs = 12 means the multiplier is 6, so total = (15 + 6 + 2) x 6 = 23 x 6 = 138.',
 wrong:'Scale the two ratios so the shared term (associates) matches before combining.'},
{id:'Q106',section:'Q',type:'PS',domain:'arithmetic',context:'real',skill:'q_rrp',diff:3,
 stem:'Renata deposits $5,000 in an account that pays 8% annual interest compounded semiannually. How much more interest will she earn in the first year than she would have earned if the account paid 8% simple annual interest?',
 choices:['$4','$8','$16','$40','$80'],answer:1,
 expl:'Semiannual: 4% per half-year, so 5000 x 1.04^2 = 5000 x 1.0816 = 5408, interest $408. Simple: 5000 x 0.08 = $400. Difference = $8.',
 wrong:'The extra interest is just interest on the first half-year\'s interest: 4% of $200 = $8.'},
{id:'Q107',section:'Q',type:'PS',domain:'arithmetic',context:'real',skill:'q_rrp',diff:4,
 stem:'Pipe A alone can fill an empty tank in 4 hours and pipe B alone can fill it in 6 hours. Drain C alone can empty the full tank in 3 hours. The tank starts empty; pipes A and B are opened at the same time, and drain C is opened exactly 1 hour later. How many hours after A and B are opened will the tank be full?',
 choices:['8','9','10','12','20'],answer:0,
 expl:'A + B fill 1/4 + 1/6 = 5/12 per hour, so after 1 hour the tank is 5/12 full. With C open the net rate is 5/12 - 1/3 = 5/12 - 4/12 = 1/12 per hour. Remaining 7/12 takes 7 hours. Total = 1 + 7 = 8 hours.',
 wrong:'Forgetting the first hour without the drain (using net rate 1/12 for the whole tank) gives 12 hours, choice D.'},
{id:'Q108',section:'Q',type:'PS',domain:'arithmetic',context:'real',skill:'q_rrp',diff:4,
 stem:'A retailer bought a shipment of identical lamps for a total of $2,400. She sold three-fourths of the lamps at a price 30% above her cost per lamp and sold the remaining lamps at a price 20% below her cost per lamp. Her total profit was what percent of her total cost?',
 choices:['10%','12.5%','15%','17.5%','20%'],answer:3,
 expl:'Cost of first group: 3/4 x 2400 = 1800, sold for 1800 x 1.3 = 2340. Cost of the rest: 600, sold for 600 x 0.8 = 480. Revenue 2820, profit 420, and 420/2400 = 17.5%.',
 wrong:'Weighted average of the percent changes: 0.75 x 30 + 0.25 x (-20) = 22.5 - 5 = 17.5. Do not simply average 30 and -20 to get 5%.'},
{id:'Q109',section:'Q',type:'PS',domain:'arithmetic',context:'real',skill:'q_rrp',diff:4,
 stem:'On a road trip, a driver covered the first one-third of the total distance at an average speed of 40 miles per hour and the remaining distance at an average speed of 60 miles per hour. What was the driver\'s average speed, in miles per hour, for the entire trip?',
 choices:['50','51 3/7','52','53 1/3','55'],answer:1,
 expl:'Pick total distance 120 miles. First 40 miles at 40 mph = 1 h; remaining 80 miles at 60 mph = 4/3 h. Total 7/3 h. Average = 120/(7/3) = 360/7 = 51 3/7 mph.',
 wrong:'D (53 1/3) is the distance-weighted average of speeds. Average speed is total distance over total time; A (50) is the plain average of the speeds.'},
{id:'Q110',section:'Q',type:'PS',domain:'algebra',context:'real',skill:'q_rrp',diff:4,
 stem:'A company\'s revenue increased by p percent from 2022 to 2023 and then decreased by p percent from 2023 to 2024. If the company\'s revenue in 2024 was 9% less than its revenue in 2022, what is the value of p?',
 choices:['3','9','10','30','45'],answer:3,
 expl:'(1 + p/100)(1 - p/100) = 1 - (p/100)^2 = 0.91, so (p/100)^2 = 0.09, p/100 = 0.3, p = 30. Check: 100 -> 130 -> 91.',
 wrong:'B (9) treats the loss as if it were p itself; the net loss from an up-then-down move is the square of the fractional change.'},
{id:'Q111',section:'Q',type:'PS',domain:'algebra',context:'real',skill:'q_rrp',diff:4,
 stem:'Two inlet pipes fill a swimming pool. Alone, the larger pipe fills the empty pool in x hours, and alone the smaller pipe fills it in x + 5 hours. Together the two pipes fill the empty pool in 6 hours. What is the value of x?',
 choices:['6','8','10','12','15'],answer:2,
 expl:'1/x + 1/(x+5) = 1/6. Multiply by 6x(x+5): 6(x+5) + 6x = x^2 + 5x, so x^2 - 7x - 30 = 0, (x - 10)(x + 3) = 0, x = 10. Check: 1/10 + 1/15 = 5/30 = 1/6.',
 wrong:'Back-solve: x must exceed 6 (the combined time), eliminating A. Try C: 1/10 + 1/15 = 1/6. Done.'},
{id:'Q112',section:'Q',type:'PS',domain:'algebra',context:'real',skill:'q_rrp',diff:5,
 stem:'Working together at their constant rates, Ana and Ben can paint a fence in 2 hours. Working alone, Ana would need 3 hours less than Ben would need alone. If Ana had painted alone for 1 hour and then stopped, and Ben had then finished the fence by himself, how many hours in total would the job have taken?',
 choices:['4','4.5','5','6','7'],answer:2,
 expl:'Let Ana take a hours alone, Ben a + 3. 1/a + 1/(a+3) = 1/2 gives 2(2a + 3) = a^2 + 3a, so a^2 - a - 6 = 0, (a - 3)(a + 2) = 0, a = 3, Ben = 6. Ana does 1/3 in her hour; Ben finishes 2/3 at 1/6 per hour, taking 4 hours. Total 1 + 4 = 5 hours.',
 wrong:'D (6) is Ben\'s solo time; the question asks for the total elapsed time of the two-stage plan.'},
// ---------- q_alg (12) ----------
{id:'Q113',section:'Q',type:'PS',domain:'algebra',context:'real',skill:'q_alg',diff:2,
 stem:'Maya is currently 4 times as old as her son. In 12 years, Maya will be exactly twice as old as her son. How old is her son now?',
 choices:['4','6','8','10','12'],answer:1,
 expl:'Let son = s, Maya = 4s. 4s + 12 = 2(s + 12), so 4s + 12 = 2s + 24, 2s = 12, s = 6.',
 wrong:'Remember to add 12 to both ages, not just to Maya\'s.'},
{id:'Q114',section:'Q',type:'PS',domain:'algebra',context:'pure',skill:'q_alg',diff:2,
 stem:'If 3^(2x - 1) = 81, what is the value of x?',
 choices:['0.5','1.5','2','2.5','3'],answer:3,
 expl:'81 = 3^4, so 2x - 1 = 4, 2x = 5, x = 2.5.',
 wrong:'C (2) comes from setting 2x = 4 and ignoring the -1 in the exponent.'},
{id:'Q115',section:'Q',type:'PS',domain:'algebra',context:'real',skill:'q_alg',diff:3,
 stem:'A community theater sold 150 tickets to a play for a total of $1,400. Adult tickets cost $12 each and child tickets cost $7 each. How many adult tickets were sold?',
 choices:['40','50','60','65','70'],answer:4,
 expl:'Let a = adult tickets, 150 - a = child tickets. 12a + 7(150 - a) = 1400, so 5a + 1050 = 1400, 5a = 350, a = 70. Check: 70 x 12 + 80 x 7 = 840 + 560 = 1400.',
 wrong:'If all 150 were child tickets the total would be $1,050; each swap to an adult ticket adds $5, and 350/5 = 70.'},
{id:'Q116',section:'Q',type:'PS',domain:'algebra',context:'pure',skill:'q_alg',diff:3,
 stem:'How many integers x satisfy the inequality |2x - 5| < 7?',
 choices:['5','6','7','8','12'],answer:1,
 expl:'-7 < 2x - 5 < 7, so -2 < 2x < 12, so -1 < x < 6. Integers 0, 1, 2, 3, 4, 5: six of them.',
 wrong:'The endpoints -1 and 6 are excluded because the inequality is strict; including them gives 8 (D).'},
{id:'Q117',section:'Q',type:'PS',domain:'algebra',context:'real',skill:'q_alg',diff:3,
 stem:'A small bakery\'s weekly cost, in dollars, to produce n specialty cakes is given by C(n) = 250 + 12n, and it sells every cake it produces for $20. What is the least number of cakes the bakery must produce and sell in a week in order to earn a profit?',
 choices:['26','28','30','31','32'],answer:4,
 expl:'Profit = 20n - (250 + 12n) = 8n - 250 > 0, so n > 31.25. The least integer is 32. Check: n = 31 gives 8 x 31 - 250 = -2 (loss); n = 32 gives +6.',
 wrong:'D (31) rounds 31.25 down; at 31 cakes the bakery still loses $2.'},
{id:'Q118',section:'Q',type:'PS',domain:'algebra',context:'pure',skill:'q_alg',diff:3,
 stem:'If f(x) = 2x + 3 and g(x) = x^2 - 1, what is the value of f(g(2)) - g(f(2))?',
 choices:['-39','-15','0','15','39'],answer:0,
 expl:'g(2) = 3, so f(g(2)) = 2 x 3 + 3 = 9. f(2) = 7, so g(f(2)) = 49 - 1 = 48. Difference: 9 - 48 = -39.',
 wrong:'E (39) reverses the order of subtraction; composition order matters, so f(g(2)) and g(f(2)) are different numbers.'},
{id:'Q119',section:'Q',type:'PS',domain:'algebra',context:'real',skill:'q_alg',diff:4,
 stem:'The length of a rectangular garden is 3 meters more than twice its width. If the area of the garden is 65 square meters, what is its perimeter, in meters?',
 choices:['18','26','32','36','65'],answer:3,
 expl:'w(2w + 3) = 65, so 2w^2 + 3w - 65 = 0, (2w + 13)(w - 5) = 0, w = 5, length = 13. Perimeter = 2(5 + 13) = 36.',
 wrong:'A (18) is length plus width, only half the perimeter. Factor pairs of 65 (5 x 13) make guessing fast.'},
{id:'Q120',section:'Q',type:'PS',domain:'algebra',context:'pure',skill:'q_alg',diff:4,
 stem:'If x + 1/x = 5, what is the value of x^3 + 1/x^3?',
 choices:['100','110','115','120','125'],answer:1,
 expl:'(x + 1/x)^3 = x^3 + 1/x^3 + 3(x + 1/x). So 125 = x^3 + 1/x^3 + 15, giving x^3 + 1/x^3 = 110.',
 wrong:'E (125) forgets the cross terms 3x + 3/x when cubing the sum.'},
{id:'Q121',section:'Q',type:'PS',domain:'algebra',context:'real',skill:'q_alg',diff:4,
 stem:'A parking meter contains only quarters and dimes. It holds 140 coins with a total value of $23.75. How many quarters does it contain?',
 choices:['45','55','60','65','75'],answer:3,
 expl:'Let q = quarters, 140 - q = dimes. 25q + 10(140 - q) = 2375, so 15q + 1400 = 2375, 15q = 975, q = 65. Check: 65 x 25 + 75 x 10 = 1625 + 750 = 2375.',
 wrong:'E (75) is the number of dimes, not quarters.'},
{id:'Q122',section:'Q',type:'PS',domain:'algebra',context:'pure',skill:'q_alg',diff:4,
 stem:'How many integers x satisfy both x^2 - 9x + 14 < 0 and |x - 6| >= 2?',
 choices:['0','1','2','3','4'],answer:2,
 expl:'x^2 - 9x + 14 = (x - 2)(x - 7) < 0 means 2 < x < 7, so x is in {3, 4, 5, 6}. |x - 6| >= 2 means x <= 4 or x >= 8. Both: x = 3 or 4. Two integers.',
 wrong:'E (4) counts only the quadratic condition and ignores the absolute value restriction.'},
{id:'Q123',section:'Q',type:'PS',domain:'algebra',context:'pure',skill:'q_alg',diff:5,
 stem:'For how many integer values of x is |x - 3| + |x + 2| = 5?',
 choices:['0','1','2','5','6'],answer:4,
 expl:'|x - 3| + |x + 2| is the total distance from x to 3 and to -2. That total equals 5 (the distance between -2 and 3) exactly when x lies between them: -2 <= x <= 3. Integers -2, -1, 0, 1, 2, 3: six values.',
 wrong:'C (2) comes from assuming only the endpoints -2 and 3 work; every point between the two anchors also gives a sum of 5.'},
{id:'Q124',section:'Q',type:'PS',domain:'algebra',context:'real',skill:'q_alg',diff:5,
 stem:'A vendor sells a certain gadget for p dollars per unit and takes in $2,400 in revenue. If she had lowered the price by $4 per unit, she would have sold 50 more units and taken in the same $2,400. What is the value of p?',
 choices:['12','16','20','24','30'],answer:1,
 expl:'Let n = units at price p, so pn = 2400 and (p - 4)(n + 50) = 2400. Expand: pn + 50p - 4n - 200 = 2400, so 50p - 4n = 200. Substitute n = 2400/p: 50p - 9600/p = 200, so p^2 - 4p - 192 = 0, (p - 16)(p + 12) = 0, p = 16. Check: 16 x 150 = 2400 and 12 x 200 = 2400.',
 wrong:'Back-solve with the choices: p = 16 gives 150 units, p - 4 = 12 gives 200 units, exactly 50 more.'},
// ---------- q_vof (8) ----------
{id:'Q125',section:'Q',type:'PS',domain:'arithmetic',context:'pure',skill:'q_vof',diff:2,
 stem:'What is the least common multiple of 84 and 126?',
 choices:['42','126','252','504','10,584'],answer:2,
 expl:'84 = 2^2 x 3 x 7 and 126 = 2 x 3^2 x 7. LCM takes the highest power of each prime: 2^2 x 3^2 x 7 = 252.',
 wrong:'A (42) is the GCF, and E (10,584) is the product of the two numbers.'},
{id:'Q126',section:'Q',type:'PS',domain:'arithmetic',context:'real',skill:'q_vof',diff:3,
 stem:'Three shuttle buses leave a hotel at the same time at 9:00 a.m. and then depart again every 12 minutes, every 18 minutes, and every 30 minutes, respectively. At what time will all three buses next depart together?',
 choices:['10:30 a.m.','11:00 a.m.','11:30 a.m.','12:00 noon','1:00 p.m.'],answer:3,
 expl:'LCM(12, 18, 30): 12 = 2^2 x 3, 18 = 2 x 3^2, 30 = 2 x 3 x 5, so LCM = 2^2 x 3^2 x 5 = 180 minutes = 3 hours. 9:00 + 3:00 = 12:00 noon.',
 wrong:'B (11:00) uses 120 minutes, the LCM of only 12 and 30 combined with 18 incorrectly.'},
{id:'Q127',section:'Q',type:'PS',domain:'arithmetic',context:'pure',skill:'q_vof',diff:3,
 stem:'What is the remainder when 7^26 is divided by 5?',
 choices:['0','1','2','3','4'],answer:4,
 expl:'Units digits of powers of 7 cycle 7, 9, 3, 1 (period 4). 26 = 4 x 6 + 2, so 7^26 ends in 9. A number ending in 9 leaves remainder 4 when divided by 5.',
 wrong:'Equivalent: 7 = 2 (mod 5), and 2^26 = (2^4)^6 x 2^2 = 1 x 4 = 4 (mod 5).'},
{id:'Q128',section:'Q',type:'PS',domain:'arithmetic',context:'real',skill:'q_vof',diff:4,
 stem:'When a certain number of marbles is divided equally among 8 children, 5 marbles are left over. When the same marbles are divided equally among 6 children, 3 marbles are left over. How many possible values are there for the number of marbles if it is between 100 and 200?',
 choices:['3','4','5','6','8'],answer:1,
 expl:'n = 5 (mod 8) and n = 3 (mod 6). List 5, 13, 21, ...: 21 = 3 (mod 6), so n = 21 (mod 24) since LCM(8, 6) = 24. Between 100 and 200: 117, 141, 165, 189. Four values.',
 wrong:'Note the pattern repeats every LCM(8, 6) = 24, not every 48.'},
{id:'Q129',section:'Q',type:'PS',domain:'arithmetic',context:'pure',skill:'q_vof',diff:4,
 stem:'How many positive divisors of 360 are even?',
 choices:['6','12','15','18','24'],answer:3,
 expl:'360 = 2^3 x 3^2 x 5. Total divisors = 4 x 3 x 2 = 24. Odd divisors use no factor of 2: 3 x 2 = 6. Even divisors = 24 - 6 = 18.',
 wrong:'E (24) is the total number of divisors; A (6) is the number of odd divisors.'},
{id:'Q130',section:'Q',type:'PS',domain:'arithmetic',context:'pure',skill:'q_vof',diff:4,
 stem:'If a = 2^30, b = 3^20, and c = 5^12, which of the following correctly orders a, b, and c from least to greatest?',
 choices:['a < b < c','a < c < b','b < a < c','c < b < a','c < a < b'],answer:4,
 expl:'Rewrite with a common exponent. Using exponent 10: a = (2^3)^10 = 8^10 and b = (3^2)^10 = 9^10, so a < b. Compare c with a using exponent 6: a = (2^5)^6 = 32^6 and c = (5^2)^6 = 25^6, so c < a. Order: c < a < b.',
 wrong:'Bigger base does not mean bigger value when exponents differ; rewrite with a common exponent (here 10) before comparing.'},
{id:'Q131',section:'Q',type:'PS',domain:'arithmetic',context:'pure',skill:'q_vof',diff:4,
 stem:'What is the greatest integer k such that 12^k is a divisor of 30! (30 factorial)?',
 choices:['7','10','13','14','26'],answer:2,
 expl:'12^k = 2^(2k) x 3^k. Powers of 2 in 30!: 15 + 7 + 3 + 1 = 26. Powers of 3: 10 + 3 + 1 = 14. Need 2k <= 26 (k <= 13) and k <= 14, so k = 13.',
 wrong:'D (14) counts only the 3s. Each 12 needs two 2s, and the 2s run out first.'},
{id:'Q132',section:'Q',type:'PS',domain:'arithmetic',context:'real',skill:'q_vof',diff:5,
 stem:'A bakery has fewer than 250 cookies. If it packs them in boxes of 12, 7 cookies are left over; if it packs them in boxes of 9, 4 are left over; and if it packs them in boxes of 5, none are left over. How many cookies does the bakery have?',
 choices:['31','55','103','139','175'],answer:4,
 expl:'n = 7 (mod 12): 7, 19, 31, 43, ... Of these, n = 4 (mod 9) first at 31 (31 = 27 + 4), and the pattern repeats every LCM(12, 9) = 36: 31, 67, 103, 139, 175, 211, 247. The first that is a multiple of 5 is 175. Check: 175 = 14 x 12 + 7, 175 = 19 x 9 + 4, 175 = 35 x 5.',
 wrong:'C (103) and D (139) satisfy the first two conditions but are not multiples of 5.'},
// ---------- q_csp (8) ----------
{id:'Q133',section:'Q',type:'PS',domain:'arithmetic',context:'real',skill:'q_csp',diff:2,
 stem:'Of the 60 students in a class, 35 are studying French, 28 are studying Spanish, and 8 are studying neither language. How many students are studying both French and Spanish?',
 choices:['11','15','19','23','27'],answer:0,
 expl:'Students studying at least one language: 60 - 8 = 52. French + Spanish - Both = 52, so 35 + 28 - Both = 52, Both = 11.',
 wrong:'Forgetting the "neither" group and setting 35 + 28 - Both = 60 gives 3, which is not offered.'},
{id:'Q134',section:'Q',type:'PS',domain:'arithmetic',context:'pure',skill:'q_csp',diff:2,
 stem:'The average (arithmetic mean) of five numbers is 20. If four of the numbers are 12, 18, 25, and 30, what is the fifth number?',
 choices:['15','17','20','21','25'],answer:0,
 expl:'Sum of five numbers = 5 x 20 = 100. Sum of the four given = 85. Fifth number = 15.',
 wrong:'Do not average the four given numbers (about 21); the missing value must bring the total to 100.'},
{id:'Q135',section:'Q',type:'PS',domain:'arithmetic',context:'real',skill:'q_csp',diff:3,
 stem:'On a certain exam, the 20 students in Section A had an average (arithmetic mean) score of 80, and the 30 students in Section B had an average score of 70. What was the average score of all 50 students?',
 choices:['72','74','75','76','78'],answer:1,
 expl:'Total points = 20 x 80 + 30 x 70 = 1600 + 2100 = 3700. Average = 3700/50 = 74.',
 wrong:'C (75) is the unweighted midpoint; the larger section pulls the average toward 70.'},
{id:'Q136',section:'Q',type:'PS',domain:'arithmetic',context:'real',skill:'q_csp',diff:3,
 stem:'A committee of 3 people is to be selected from a group of 7 people. Two of the seven, Lena and Marcus, refuse to serve on the committee together. How many different committees are possible?',
 choices:['10','20','25','30','35'],answer:3,
 expl:'Total committees: C(7,3) = 35. Committees containing both Lena and Marcus: choose the third member from the other 5, so 5. Allowed: 35 - 5 = 30.',
 wrong:'B (20) is C(6,3), which wrongly removes one of the two people entirely.'},
{id:'Q137',section:'Q',type:'PS',domain:'arithmetic',context:'real',skill:'q_csp',diff:3,
 stem:'A bag contains 4 red marbles and 6 blue marbles. If two marbles are drawn at random without replacement, what is the probability that at least one of them is red?',
 choices:['1/3','2/5','2/3','11/15','4/5'],answer:2,
 expl:'P(no red) = (6/10)(5/9) = 30/90 = 1/3. P(at least one red) = 1 - 1/3 = 2/3.',
 wrong:'B (2/5) is just P(first is red); "at least one" is easiest via the complement.'},
{id:'Q138',section:'Q',type:'PS',domain:'algebra',context:'pure',skill:'q_csp',diff:4,
 stem:'In a sequence, a_1 = 1 and a_n = a_(n-1) + 2n for every integer n > 1. What is the value of a_10?',
 choices:['55','90','100','101','109'],answer:4,
 expl:'a_n = 1 + (4 + 6 + ... + 2n) = 1 + 2(2 + 3 + ... + n) = 1 + 2(n(n+1)/2 - 1) = n^2 + n - 1. So a_10 = 100 + 10 - 1 = 109. Check small terms: a_2 = 5, a_3 = 11.',
 wrong:'C (100) is n^2, which would be the answer if a_1 were 1 and the step were 2n - 1.'},
{id:'Q139',section:'Q',type:'PS',domain:'arithmetic',context:'pure',skill:'q_csp',diff:5,
 stem:'A fair coin is tossed 5 times. What is the probability that exactly 3 of the tosses are heads and no two heads occur on consecutive tosses?',
 choices:['1/32','3/32','5/32','5/16','1/2'],answer:0,
 expl:'There are 2^5 = 32 equally likely sequences. Three heads among 5 tosses with no two adjacent forces the pattern H T H T H, the only such sequence. Probability = 1/32.',
 wrong:'D (5/16 = 10/32) is the probability of exactly 3 heads with no adjacency restriction.'},
{id:'Q140',section:'Q',type:'PS',domain:'arithmetic',context:'real',skill:'q_csp',diff:5,
 stem:'In a survey of 100 people, 50 said they like brand A, 45 like brand B, and 40 like brand C. Exactly 20 people like exactly two of the three brands, and 10 people like all three brands. How many of the people surveyed like none of the three brands?',
 choices:['5','10','15','20','25'],answer:0,
 expl:'Adding the three counts double-counts the "exactly two" group and triple-counts the "all three" group: 50 + 45 + 40 = 135 = (exactly one) + 2(20) + 3(10), so exactly one = 65. At least one = 65 + 20 + 10 = 95. None = 100 - 95 = 5.',
 wrong:'Using |A u B u C| = 135 - 20 - 2(10) = 95 gives the same result; the trap is subtracting the "exactly two" total as if it were the sum of pairwise overlaps.'}
];

// Verbal seed bank. CR items and two RC passages. skill: v_ac (Analysis/Critique), v_pc (Plan/Construct), v_inf (Identify Inferred Idea), v_st (Identify Stated Idea)
const RC_P1 = 'Until the mid-nineteenth century, retail transactions in most American cities were governed by haggling: prices were rarely posted, and the final figure depended on the merchant\'s assessment of the customer\'s willingness to pay. The department stores that emerged in the 1860s and 1870s upended this arrangement by adopting fixed, clearly marked prices. Historians have often credited the innovation to a desire for efficiency; a clerk who does not negotiate can serve more customers per hour. Yet efficiency alone does not explain why the policy spread so quickly, or why customers embraced it.\n\nA more persuasive account emphasizes trust. Fixed prices allowed stores to advertise specific figures in newspapers, and a shopper who found the advertised price honored at the counter had reason to return. Just as important, fixed prices made the liberal return policies that department stores pioneered financially workable: a store could refund a purchase only if it knew what had been paid. The result was a self-reinforcing cycle in which transparency generated confidence, confidence generated volume, and volume permitted the low margins that made fixed prices competitive.\n\nSome scholars have objected that this account overstates the novelty of the practice, noting that Quaker merchants had posted fixed prices a century earlier on religious grounds. But the Quaker precedent, confined to a small community and justified by principle rather than profit, never produced the commercial transformation that the department stores achieved.';

const RC_P2 = 'Reef-building corals depend on microscopic algae, called zooxanthellae, that live within their tissues and supply, through photosynthesis, as much as ninety percent of the coral\'s energy. When water temperatures rise even one to two degrees Celsius above the local summer maximum for several weeks, the algae\'s photosynthetic machinery begins to produce damaging reactive oxygen compounds, and the coral expels them. Deprived of both its energy source and its pigment, the coral turns white, a condition known as bleaching. Bleaching is not immediately fatal; if temperatures fall soon enough, corals can reacquire algae from the surrounding water. Prolonged bleaching, however, leads to starvation and death.\n\nResearchers once assumed that a coral\'s heat tolerance was fixed, but recent studies suggest a more complicated picture. Some corals host several algal types, and after bleaching may be repopulated by a heat-tolerant type that was previously rare, a process termed symbiont shuffling. Corals in the Persian Gulf, where summer temperatures routinely exceed those that trigger bleaching elsewhere, appear to rely on such tolerant symbionts. This finding has encouraged proposals to seed vulnerable reefs with heat-tolerant algae.\n\nCritics caution that tolerant symbionts often grow more slowly and transfer less energy to their hosts, so that a shuffled coral may survive a heat wave only to lose ground to competitors in ordinary conditions. Whether shuffling represents a durable adaptation or a temporary trade-off remains, for now, an open question.';

const BANK_VERBAL = [
{id:'V001',section:'V',type:'CR',sub:'assumption',skill:'v_ac',diff:2,
 stem:'City council member: Installing speed cameras on Elm Street reduced traffic accidents there by 30 percent last year. Therefore, installing speed cameras on Oak Street will reduce accidents on Oak Street as well.\n\nThe council member\'s argument depends on which of the following assumptions?',
 choices:['Oak Street currently has more accidents per year than Elm Street had before the cameras were installed.','The factors that cause accidents on Oak Street are similar to those that the cameras addressed on Elm Street.','Speed cameras are the most cost-effective method available for reducing traffic accidents.','A majority of Oak Street residents support the installation of speed cameras.','Accidents on Elm Street had been increasing in the years before the cameras were installed.'],answer:1,
 expl:'The argument transfers a result from Elm to Oak. That only works if Oak\'s accidents are the kind cameras address (speed-related). Negate B: if Oak\'s accidents are caused by something else, the conclusion collapses. That is the assumption.',
 wrong:'A, D, E add detail but the argument survives without them. C is about cost, not effectiveness.'},
{id:'V002',section:'V',type:'CR',sub:'weaken',skill:'v_ac',diff:3,
 stem:'Nutritionist: People who eat breakfast every day have, on average, a lower body mass index than people who regularly skip breakfast. Clearly, eating breakfast daily helps people control their weight.\n\nWhich of the following, if true, most seriously weakens the nutritionist\'s argument?',
 choices:['Many popular breakfast foods are high in added sugar.','People who eat breakfast every day are more likely than breakfast skippers to follow other healthy habits, such as exercising regularly.','Skipping breakfast is more common among adolescents than among adults.','Some people who eat breakfast daily consume more total calories per day than some people who skip it.','Body mass index is an imperfect measure of overall health.'],answer:1,
 expl:'The argument moves from correlation to cause. B supplies an alternative cause (a general healthy lifestyle) that could explain the lower BMI, so breakfast itself may not be doing the work.',
 wrong:'D is tempting but "some" people is too weak to undermine an average. E attacks the measure, not the causal link.'},
{id:'V003',section:'V',type:'CR',sub:'strengthen',skill:'v_ac',diff:3,
 stem:'After one department at a company piloted a four-day workweek for six months, output per employee in that department rose 8 percent. The company\'s managers concluded that adopting a four-day workweek companywide would raise output per employee across the company.\n\nWhich of the following, if true, most strengthens the managers\' conclusion?',
 choices:['Employees in the pilot department were selected at random from across all of the company\'s functions.','Before the pilot, the pilot department had the lowest output per employee of any department in the company.','None of the company\'s competitors has adopted a four-day workweek.','Output per employee in the pilot department had been rising steadily in the year before the pilot began.','A four-day workweek is popular among the company\'s employees.'],answer:0,
 expl:'The gap is generalizing from one department to the whole company. A makes the pilot group representative, which is exactly what the generalization needs.',
 wrong:'B and D weaken (room to improve, or a pre-existing trend). C and E are irrelevant to output.'},
{id:'V004',section:'V',type:'CR',sub:'evaluate',skill:'v_ac',diff:4,
 stem:'A museum introduced free admission on Sundays, and total attendance rose 25 percent over the following year. The museum\'s director concluded that the free-Sunday policy is increasing the number of people who visit the museum each year.\n\nWhich of the following would it be most useful to know in order to evaluate the director\'s conclusion?',
 choices:['Whether other museums in the city have adopted similar free-admission policies','Whether the people who visit on free Sundays would otherwise have visited on days when admission is charged','Whether the museum\'s operating costs rose during the year','How many people visited the museum ten years ago','Whether visitors on free Sundays spend money in the museum\'s gift shop'],answer:1,
 expl:'The conclusion is about total annual visitors. If Sunday visitors merely shifted from paid days, the policy is not adding people, just moving them. B tests exactly that.',
 wrong:'C and E concern revenue, not visitor counts. A and D are background, not evaluation of this causal claim.'},
{id:'V005',section:'V',type:'CR',sub:'inference',skill:'v_inf',diff:4,
 stem:'In Country X, every electrician licensed last year began an apprenticeship exactly four years earlier. Last year more electricians were licensed than in any prior year. Yet the number of people who began apprenticeships four years before last year was smaller than the number who began apprenticeships five years before last year.\n\nIf the statements above are true, which of the following must also be true?',
 choices:['The apprenticeship program became easier to complete over the past five years.','A greater proportion of the apprentices who began four years before last year became licensed than of those who began five years before last year.','Fewer electricians will be licensed in Country X next year than were licensed last year.','Country X is currently experiencing a shortage of licensed electricians.','Most people who begin apprenticeships in Country X never become licensed electricians.'],answer:1,
 expl:'The four-years-ago cohort was smaller than the five-years-ago cohort, yet it produced more licenses than any prior year (including the year the five-years-ago cohort was licensed). Fewer starters, more finishers means a higher completion proportion. B must be true.',
 wrong:'A offers a possible explanation but is not forced. C, D, E go beyond the facts given.'},
{id:'V006',section:'V',type:'CR',sub:'plan',skill:'v_pc',diff:3,
 stem:'To reduce the amount of household waste sent to its landfill, a town plans to charge residents a fee for each bag of trash collected, reasoning that residents will produce less waste when they must pay for its disposal.\n\nWhich of the following, if true, most seriously calls into question the effectiveness of the plan?',
 choices:['Several neighboring towns already charge residents a per-bag fee for trash collection.','Many residents are likely to respond to the fee by dumping trash illegally in rural areas rather than by reducing the waste they produce.','The town\'s recycling program accepts most types of plastic.','The per-bag fees would generate substantial revenue for the town.','Trash collection in the town is currently funded through property taxes.'],answer:1,
 expl:'The plan\'s goal is less waste going to the landfill because residents produce less. B says residents will respond in a way that defeats the mechanism (waste is displaced, not reduced), so the plan\'s effectiveness is undermined.',
 wrong:'A and D are neutral or supportive. C and E are background.'},
{id:'V007',section:'V',type:'CR',sub:'paradox',skill:'v_ac',diff:3,
 stem:'A retailer cut prices on all its merchandise by 10 percent. Over the next quarter, the number of items it sold rose 15 percent, yet its total profit for the quarter fell.\n\nWhich of the following, if true, best explains the decline in profit?',
 choices:['The retailer\'s competitors did not match the price cut.','Before the price cut, the retailer\'s profit margin on most items was less than 10 percent of the selling price.','Customers bought more of the retailer\'s highest-margin items after the cut.','The retailer\'s advertising costs fell during the quarter.','The price cut was widely publicized in local media.'],answer:1,
 expl:'If margin was under 10% of price, a 10% price cut wipes out or reverses the profit on each item. Selling 15% more items at zero or negative profit lowers total profit. B resolves the paradox.',
 wrong:'A, C, D, E would each make profit more likely to rise, deepening the puzzle rather than resolving it.'},
{id:'V008',section:'V',type:'CR',sub:'boldface',skill:'v_ac',diff:4,
 stem:'Some economists argue that [1] raising the minimum wage will reduce employment among low-skill workers. However, studies comparing neighboring states with different minimum wages have found no consistent differences in employment. [2] Therefore, moderate increases in the minimum wage are unlikely to reduce employment.\n\nIn the argument, the two portions in brackets play which of the following roles?',
 choices:['The first is evidence supporting the argument\'s conclusion; the second is that conclusion.','The first is a claim that the argument disputes; the second is the argument\'s main conclusion.','The first is the argument\'s main conclusion; the second is a consideration raised against it.','The first is a prediction the argument endorses; the second is a qualification of that prediction.','The first and second are both premises offered in support of an unstated conclusion.'],answer:1,
 expl:'"Some economists argue" introduces a view the author is about to reject; "However" signals the turn; "Therefore" marks the author\'s own conclusion. B.',
 wrong:'A misreads the opposing view as support. C reverses the roles.'},
{id:'V009',section:'V',type:'CR',sub:'flaw',skill:'v_ac',diff:3,
 stem:'Every successful startup founder I know worked 80-hour weeks during their company\'s first year. Therefore, working 80-hour weeks is necessary for startup success.\n\nThe reasoning above is most vulnerable to criticism on the grounds that it',
 choices:['generalizes from a limited and possibly unrepresentative group of founders','assumes that working long hours guarantees success','fails to define what counts as success for a startup','relies on the founders\' own reports of the hours they worked','ignores the possibility that some industries require fewer hours than others'],answer:0,
 expl:'The evidence is "founders I know," a personal sample. Concluding a universal necessity from that sample is the flaw. A.',
 wrong:'B describes sufficiency; the argument claims necessity. C, D, E are minor or unsupported.'},
{id:'V010',section:'V',type:'CR',sub:'assumption',skill:'v_ac',diff:4,
 stem:'Airline X\'s on-time arrival rate improved from 70 percent to 85 percent after the airline added 20 minutes to the scheduled duration of each of its flights. Thus, Airline X\'s operations have become more efficient.\n\nThe argument relies on which of the following assumptions?',
 choices:['The added 20 minutes of scheduled time does not by itself account for the entire improvement in the on-time rate.','Passengers prefer longer scheduled flight times to shorter ones.','No other airline changed its scheduled flight times during the same period.','Airline X\'s fares did not increase after the schedule change.','On-time performance is the most important measure of an airline\'s quality.'],answer:0,
 expl:'The premise itself supplies an alternative explanation: padded schedules make "on time" easier to hit. For the conclusion (real efficiency) to follow, the padding must not explain the whole gain. Negate A and the argument dies.',
 wrong:'B, D, E are off-topic. C is about other airlines, irrelevant to X\'s efficiency.'},
{id:'V011',section:'V',type:'CR',sub:'strengthen',skill:'v_ac',diff:4,
 stem:'Archaeologists excavating Site K found storage pits containing grain that date to 9,000 years ago, earlier than any previously known farming in the region. They concluded that the inhabitants of Site K practiced agriculture.\n\nWhich of the following, if true, most strengthens the archaeologists\' conclusion?',
 choices:['The grain found in the pits was of a domesticated variety that does not grow in the wild.','Site K is located near a river that floods seasonally.','Other sites in the region show clear evidence of farming beginning 8,000 years ago.','The storage pits were lined with clay to keep out moisture.','Wild grains were abundant in the area surrounding Site K 9,000 years ago.'],answer:0,
 expl:'The gap: stored grain could have been gathered wild rather than farmed. A closes it: domesticated grain that does not grow wild had to be cultivated.',
 wrong:'E weakens (gathering explains the pits). C is about other sites. B and D are neutral.'},
{id:'V012',section:'V',type:'CR',sub:'inference',skill:'v_inf',diff:3,
 stem:'Whenever a software firm releases a new tutorial video, its volume of customer support tickets falls by about 40 percent, then returns to its previous level within a month. The firm releases a new tutorial video once each quarter. Therefore, ______.\n\nWhich of the following most logically completes the argument?',
 choices:['the videos permanently reduce the confusion users experience with the software','the firm\'s support-ticket volume is at its lowest in the weeks immediately following each quarterly release','the firm should release tutorial videos monthly rather than quarterly','users typically watch each tutorial video only once','the firm could reduce its support staff by 40 percent'],answer:1,
 expl:'Facts: 40% drop after each release, recovery within a month, releases quarterly. What follows: the lows occur right after each release. B is a direct consequence.',
 wrong:'A contradicts the "returns to previous level" fact. C is a recommendation, not an inference. D and E overreach.'},
{id:'V013',section:'V',type:'CR',sub:'weaken',skill:'v_ac',diff:5,
 stem:'Hospital A has a higher patient mortality rate than Hospital B. Therefore, a patient is more likely to receive poor care at Hospital A than at Hospital B.\n\nWhich of the following, if true, most seriously weakens the argument?',
 choices:['Hospital A is a regional trauma center that receives the region\'s most critically injured patients.','Hospital B has more nurses per patient than Hospital A.','Hospital A\'s main building was constructed more recently than Hospital B\'s.','Both hospitals are fully accredited by the national hospital association.','Hospital A\'s mortality rate has declined over the past five years.'],answer:0,
 expl:'The argument assumes patient populations are comparable. A gives Hospital A a much sicker intake, which explains higher mortality without worse care.',
 wrong:'B strengthens. E does not address the comparison between the two hospitals. C and D are neutral.'},
{id:'V014',section:'V',type:'CR',sub:'plan',skill:'v_pc',diff:4,
 stem:'To cut its energy consumption, a university plans to replace all campus lighting with LED bulbs, which use 75 percent less electricity than the bulbs currently installed. University officials predict that total campus electricity use will fall by at least 20 percent as a result.\n\nWhich of the following must be true for the officials\' prediction to be accurate?',
 choices:['Lighting currently accounts for more than one-quarter of the campus\'s total electricity use.','LED bulbs last longer than the bulbs currently installed.','The university will receive a volume discount on the LED bulbs.','Other universities have achieved 20 percent reductions by switching to LEDs.','Electricity prices will not rise after the switch.'],answer:0,
 expl:'A 75% cut in lighting electricity yields at least a 20% total cut only if lighting is at least 20/0.75 = 26.7% of the total. So lighting must be more than a quarter of usage. A.',
 wrong:'B, C, E concern cost, not electricity use. D is about other campuses.'},
// Reading Comprehension: Passage 1
{id:'V015',section:'V',type:'RC',passageId:'P1',passage:RC_P1,skill:'v_st',diff:2,
 stem:'The passage is primarily concerned with',
 choices:['describing the practice of haggling in nineteenth-century American retail','explaining the rapid spread of fixed pricing by proposing trust, rather than efficiency, as its main driver','arguing that Quaker merchants deserve credit for inventing fixed pricing','comparing the return policies of department stores with those of smaller merchants','defending haggling as more efficient than fixed pricing'],answer:1,
 expl:'Paragraph 1 raises the efficiency account and finds it insufficient; paragraph 2 offers trust as the better account; paragraph 3 defends it against an objection. B captures the whole.',
 wrong:'A and D describe details, not the main point. C reverses the author\'s view of the Quaker precedent.'},
{id:'V016',section:'V',type:'RC',passageId:'P1',passage:RC_P1,skill:'v_st',diff:2,
 stem:'According to the passage, fixed prices made liberal return policies financially workable because',
 choices:['customers trusted stores that offered returns','a store could refund a purchase only if it knew what had been paid','clerks who did not negotiate could serve more customers','newspapers advertised the stores\' prices','low margins made returns inexpensive'],answer:1,
 expl:'Stated directly in paragraph 2: "a store could refund a purchase only if it knew what had been paid."',
 wrong:'A, C, D are true statements from the passage but not the reason given for return policies.'},
{id:'V017',section:'V',type:'RC',passageId:'P1',passage:RC_P1,skill:'v_ac',diff:4,
 stem:'The author mentions Quaker merchants primarily in order to',
 choices:['show that fixed pricing originated for religious rather than commercial reasons','acknowledge and then discount an objection to the trust-based account','suggest that department stores borrowed the practice from an earlier community','illustrate the efficiency gains that fixed prices provided','demonstrate that haggling persisted in some communities'],answer:1,
 expl:'"Some scholars have objected... But the Quaker precedent... never produced the commercial transformation." Classic concede-then-rebut structure. B.',
 wrong:'A states the objection as if the author endorsed it; the author minimizes it.'},
{id:'V018',section:'V',type:'RC',passageId:'P1',passage:RC_P1,skill:'v_inf',diff:4,
 stem:'It can be inferred that the author would most likely agree with which of the following statements?',
 choices:['Efficiency played no role in the adoption of fixed pricing.','An explanation of why a commercial practice spread should account for customer acceptance as well as merchant benefit.','Haggling was more profitable for merchants than fixed pricing.','Quaker merchants were unsuccessful in business.','Newspaper advertising was invented by department stores.'],answer:1,
 expl:'The author faults the efficiency account because it does not explain "why customers embraced it," then builds an account around customer trust. B follows.',
 wrong:'A is too extreme ("no role"); the author says efficiency "alone" is insufficient. C, D, E are unsupported.'},
{id:'V019',section:'V',type:'RC',passageId:'P1',passage:RC_P1,skill:'v_st',diff:3,
 stem:'The "self-reinforcing cycle" mentioned in the second paragraph refers to the process by which',
 choices:['haggling led customers to distrust merchants and shop elsewhere','transparency built confidence, confidence built volume, and volume allowed the low margins that kept fixed prices competitive','advertising in newspapers led to more returned merchandise','religious principle among Quakers gradually gave way to profit motive','greater efficiency allowed stores to hire more clerks'],answer:1,
 expl:'The sentence itself lists the chain: transparency to confidence to volume to low margins. B.'},
