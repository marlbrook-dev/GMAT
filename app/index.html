 {id:'v_ac',section:'V',label:'Analysis / Critique'},
 {id:'v_pc',section:'V',label:'Plan / Construct'},
 {id:'v_inf',section:'V',label:'Identify Inferred Idea'},
 {id:'v_st',section:'V',label:'Identify Stated Idea'},
 {id:'di_ds',section:'DI',label:'Data Sufficiency'},
 {id:'di_gt',section:'DI',label:'Graphs and Tables'},
 {id:'di_msr',section:'DI',label:'Multi-Source Reasoning'},
 {id:'di_tpa',section:'DI',label:'Two-Part Analysis'}
];
const SECTION_META = {Q:{name:'Quantitative Reasoning',allot:128,questions:21},V:{name:'Verbal Reasoning',allot:117,questions:23},DI:{name:'Data Insights',allot:135,questions:20}};
// Exam registry. The engine is exam-agnostic: each exam supplies its own sections, skills and pacing; item banks carry exam ids.
// Adding an exam (SAT, GRE, LSAT...) = a new entry here + a tagged bank. Progress is stored per exam.
const EXAMS = { 'gmat-focus': {id:'gmat-focus',name:'GMAT Focus Edition',sections:SECTION_META,skills:SKILLS,scoreScale:'205-805',sectionScale:'60-90'} };
const CURRENT_EXAM='gmat-focus';
const DIFF_ELO = {1:800,2:950,3:1100,4:1250,5:1400};
const START_R = 1000, MASTERY_R = 1250;
const ERROR_REASONS = [
 {id:'concept',label:'Concept gap: did not know the rule or method'},
 {id:'setup',label:'Setup / translation: knew the math, built it wrong'},
 {id:'calc',label:'Calculation slip'},
 {id:'misread',label:'Misread the question or a choice'},
 {id:'timing',label:'Ran out of time / rushed'},
 {id:'guess',label:'Guessed'},
 {id:'trap',label:'Fell for a trap answer'}
];

function newState(){
 const skills={}; SKILLS.forEach(s=>{skills[s.id]={r:START_R,n:0,c:0,t:0,hist:[]};});
 return {version:2,exam:CURRENT_EXAM,created:Date.now(),skills,attempts:[],review:{},sessions:[],seen:{},settings:{name:'Hunter',testDate:'',dailyGoal:20}};
}
function expected(r,itemR){return 1/(1+Math.pow(10,(itemR-r)/400));}
function kFor(n){return n<10?32:(n<30?24:16);}

function updateSkill(state,skillId,itemR,correct,secs,weight){
 const s=state.skills[skillId]; if(!s) return;
 const e=expected(s.r,itemR); const k=kFor(s.n)*(weight||1);
 s.r=Math.round(s.r+k*((correct?1:0)-e)); s.n+=1; if(correct) s.c+=1; s.t+=secs;
 s.hist.push(s.r); if(s.hist.length>60) s.hist.shift();
}

function timingFlag(section,secs){
 const a=SECTION_META[section].allot; if(secs>1.3*a) return 'slow'; if(secs<0.6*a) return 'fast'; return 'ok';
}

// Record one attempt. chosen: index or [i,j] for TPA. reason: error reason id or null. guessed: bool.
function recordAttempt(state,q,chosen,correct,secs,reason,guessed,sessionId){
 const itemR=DIFF_ELO[q.diff]||1100;
 updateSkill(state,q.skill,itemR,correct,secs,1);
 if(q.qskill) updateSkill(state,q.qskill,itemR,correct,secs,0.5);
 const flag=timingFlag(q.section,secs);
 state.attempts.push({qid:q.id,skill:q.skill,section:q.section,diff:q.diff,correct,secs:Math.round(secs),flag,reason:reason||null,guessed:!!guessed,ts:Date.now(),sid:sessionId||null,chosen});
 state.seen[q.id]=(state.seen[q.id]||0)+1;
 // spaced repetition
 const day=86400000; const rv=state.review[q.id]||{interval:0,due:0,lapses:0};
 if(!correct||guessed||flag==='fast'&&!correct){ rv.interval=1; rv.due=Date.now()+day; rv.lapses+=1; state.review[q.id]=rv; }
 else if(state.review[q.id]){ rv.interval=rv.interval===0?1:Math.min(Math.round(rv.interval*2.5),30); rv.due=Date.now()+rv.interval*day; if(rv.interval>=14) delete state.review[q.id]; else state.review[q.id]=rv; }
 return flag;
}

function skillStats(state,id){
 const s=state.skills[id]; const acc=s.n?s.c/s.n:null; const avg=s.n?s.t/s.n:null;
 const trend=s.hist.length>=6?s.hist[s.hist.length-1]-s.hist[s.hist.length-6]:0;
 let status='untested'; if(s.n>0&&s.n<5) status='calibrating'; else if(s.n>0){ status = (s.r>=MASTERY_R&&s.n>=15&&acc>=0.75)?'green':(s.r>=1100?'amber':'red'); }
 return {r:s.r,n:s.n,acc,avg,trend,status};
}

// Question selection
function pickQuestions(bank,state,opts){
 opts=opts||{}; const count=opts.count||10; const sections=opts.sections||['Q','V','DI'];
 let pool=bank.filter(q=>sections.includes(q.section));
 if(opts.skills&&opts.skills.length) pool=pool.filter(q=>opts.skills.includes(q.skill)||(q.qskill&&opts.skills.includes(q.qskill)));
 if(opts.diffMin) pool=pool.filter(q=>q.diff>=opts.diffMin); if(opts.diffMax) pool=pool.filter(q=>q.diff<=opts.diffMax);
 if(opts.types&&opts.types.length) pool=pool.filter(q=>opts.types.includes(q.type));
 if(!pool.length) return [];
 const now=Date.now(); const chosen=[]; const used=new Set();
 const lastSeenIdx={}; state.attempts.forEach((a,i)=>{lastSeenIdx[a.qid]=i;});
 const recency=q=>lastSeenIdx[q.id]===undefined?1e9:(state.attempts.length-lastSeenIdx[q.id]);
 function addWithGroup(q){ if(used.has(q.id)) return;
   let group=[q];
   if(q.passageId) group=pool.filter(x=>x.passageId===q.passageId);
   else if(q.passageHtml&&['MSR','GI','TA'].includes(q.type)) group=pool.filter(x=>x.passageHtml===q.passageHtml&&x.type===q.type);
   group=group.filter(x=>!used.has(x.id)).sort((a,b)=>a.id<b.id?-1:1);
   group.forEach(x=>{ if(chosen.length<count||x.id===q.id){ used.add(x.id); chosen.push(x); } }); }
 if(opts.mode==='custom'){
   const sorted=pool.slice().sort((a,b)=>recency(b)-recency(a)||Math.random()-0.5);
   for(const q of sorted){ if(chosen.length>=count) break; addWithGroup(q); }
   return chosen.slice(0,count);
 }
 // adaptive
 const due=pool.filter(q=>state.review[q.id]&&state.review[q.id].due<=now).sort((a,b)=>state.review[a.id].due-state.review[b.id].due);
 const nReview=Math.min(due.length,Math.round(count*0.15)); for(let i=0;i<nReview;i++) addWithGroup(due[i]);
 const skillIds=[...new Set(pool.map(q=>q.skill))]; const ranked=skillIds.map(id=>({id,r:state.skills[id].r,n:state.skills[id].n})).sort((a,b)=>a.r-b.r||a.n-b.n);
 const untested=ranked.filter(s=>s.n<3).map(s=>s.id);
 if(untested.length>ranked.length/2){ // diagnostic mode: round-robin across under-sampled skills at difficulty 3
   let idx=0, guard=0; const order=untested.slice().sort(()=>Math.random()-0.5);
   while(chosen.length<count&&guard<300){ guard++; const sk=order[idx%order.length]; idx++;
     const cands=pool.filter(q=>!used.has(q.id)&&q.skill===sk).sort((a,b)=>Math.abs(a.diff-3)-Math.abs(b.diff-3)||recency(b)-recency(a)||Math.random()-0.5);
     if(cands.length) addWithGroup(cands[0]); }
   if(chosen.length>=count) return chosen.slice(0,count); }
 const weak=ranked.slice(0,3).map(s=>s.id); const mid=ranked.slice(3).map(s=>s.id);
 const nWeak=Math.round((count-chosen.length)*0.7);
 function bestFor(skillSet,n){ let added=0; let guard=0;
   while(added<n&&guard<200){ guard++;
     const cands=pool.filter(q=>!used.has(q.id)&&(skillSet.includes(q.skill)));
     if(!cands.length) break;
     const scored=cands.map(q=>{ const sk=state.skills[q.skill]; const target=sk.n<6?1100:sk.r-150; // calibrate at difficulty 3 first, then ~70% expected success
        const d=Math.abs(DIFF_ELO[q.diff]-target); const rec=recency(q); const fresh=rec>=1e9?0:Math.max(0,40-rec)*10; return {q,score:d+fresh+Math.random()*60}; }).sort((a,b)=>a.score-b.score);
     const before=chosen.length; addWithGroup(scored[0].q); added+=chosen.length-before; }
   return added; }
 bestFor(weak,nWeak); bestFor(mid.length?mid:weak,count-chosen.length);
 if(chosen.length<count) bestFor(skillIds,count-chosen.length);
 return chosen.slice(0,count);
}

function sectionSummary(state,section){
 const ids=SKILLS.filter(s=>s.section===section).map(s=>s.id); const st=ids.map(id=>skillStats(state,id));
 const tested=st.filter(x=>x.n>0); const meanR=tested.length?Math.round(tested.reduce((a,b)=>a+b.r,0)/tested.length):null;
 const n=st.reduce((a,b)=>a+b.n,0); const c=ids.reduce((a,id)=>a+state.skills[id].c,0);
 let band='Not yet tested'; if(meanR!==null){ band = meanR<950?'Building (below baseline)':meanR<1100?'Developing':meanR<1250?'Competitive':'Strong (target zone)'; }
 return {meanR,n,acc:n?c/n:null,band};
}

// Flashcards: Leitner boxes. know -> box+1 (due in 1,2,4,8,16 days); still learning -> box 0 (due in 10 minutes)
const BOX_DAYS=[0,1,2,4,8,16];
function cardState(state,id){ if(!state.cards) state.cards={}; return state.cards[id]||(state.cards[id]={box:0,due:0,seen:0,known:0}); }
function rateCard(state,id,know){ const c=cardState(state,id); c.seen++; if(know){ c.known++; c.box=Math.min(5,c.box+1); c.due=Date.now()+BOX_DAYS[c.box]*86400000; } else { c.box=0; c.due=Date.now()+10*60000; } return c; }
function dueCards(state,deck,sec){ const now=Date.now(); return deck.filter(c=>(!sec||sec==='ALL'||c.sec===sec)).filter(c=>{ const st=state.cards&&state.cards[c.id]; return !st||st.due<=now; }); }

const PLAYBOOK=[
 {skill:'q_rrp',sec:'Q',title:'Rates, ratios, percent',items:['Rate x Time = Distance (or Work). Build an RTD table with one row per mover; fill two cells, solve the third.','Combined work: add rates, never times. Two machines together are always faster than the faster one alone.','Percent change = (new - old)/old. Successive changes multiply: +20% then -20% is x1.2 x 0.8 = 0.96.','Ratio multiplier: if a:b = 3:4, write a = 3k, b = 4k, then use any total or difference to find k.','Mixtures: track the pure ingredient. (acid before + acid added)/(total before + total added).','Average speed = total distance / total time. Never average the speeds.']},
 {skill:'q_vof',sec:'Q',title:'Value, order, factors',items:['Prime factorize first. Divisor count = product of (exponent + 1).','LCM takes the highest power of each prime; GCF takes the lowest. LCM x GCF = product of the two numbers.','Remainder cycles: reduce the base mod n, then find the cycle of powers.','If n^2 is divisible by p^k, n needs p^(ceil(k/2)).','Comparing fractions and decimals: convert everything to decimals to 3 places, or cross-multiply pairs.','Consecutive integers: the average equals the middle term (or the average of the two middle terms).']},
 {skill:'q_alg',sec:'Q',title:'Equalities, inequalities, algebra',items:['Word problems: define variables in words first ("a = number of adult tickets"), translate one sentence at a time, then solve.','"3 more than twice x" = 2x + 3. "Twice (3 more than x)" = 2(x + 3). Word order matters.','Inequalities flip when multiplying or dividing by a negative. Never multiply by a variable of unknown sign.','|expr| < k means -k < expr < k. |expr| > k means expr > k or expr < -k.','Discriminant b^2 - 4ac: zero means one solution, positive two, negative none.','Back-solve from the middle answer choice when the algebra looks messy; plug in numbers when answers contain variables.','Age problems: anchor every phrase to "now" before writing the equation.']},
 {skill:'q_csp',sec:'Q',title:'Counting, sets, series, probability, statistics',items:['Order matters: permutations (slots). Order does not matter: combinations (divide by k!).','"Must sit together": glue them into one unit, arrange units, multiply by internal arrangements.','Probability without replacement: multiply the changing fractions. "At least one" = 1 - P(none).','Two-set overlap: Total = A + B - Both + Neither. Subtract "neither" first.','Averages: always convert to sums. Sum = average x count.','Arithmetic sequence sum = n x (first + last)/2.','Mean vs median: median resists outliers; a skewed set has its mean pulled toward the tail.']},
 {skill:'v_ac',sec:'V',title:'Analysis and critique (critical reasoning)',items:['Find the conclusion first (after "therefore", "thus", "clearly"). Then the evidence. The gap between them is where every question lives.','Assumption: negate the choice; if the argument collapses, that is the assumption.','Strengthen / weaken: attack or defend the gap, not the evidence. Alternative causes, unrepresentative samples, and shifted terms are the big three.','Correlation-to-cause arguments: weaken with reverse causation, third factor, or coincidence.','Evaluate: the right answer is a question whose two possible answers pull the conclusion in opposite directions.','Paradox: the answer makes both facts true at once; never pick something that denies a fact.','Boldface: label each sentence as conclusion, premise, opposing view, or background before reading choices.','Predict the answer before reading the choices. Extreme words ("all", "never", "only") are usually wrong on assumption questions.']},
 {skill:'v_pc',sec:'V',title:'Plan and construct',items:['Identify the goal and the mechanism separately. A plan fails when the mechanism does not lead to the goal, or when people respond in a way that defeats it.','"Most seriously calls into question the plan": look for unintended responses (displacement, substitution, gaming).','"Required for the prediction": often a quantitative threshold hidden in the numbers.','Answers about cost, popularity, or other plans rarely bear on whether this plan works.']},
 {skill:'v_inf',sec:'V',title:'Identify inferred idea',items:['An inference must be true given the text, not merely likely. Prefer the modest answer over the interesting one.','For "complete the argument", the blank is a conclusion the facts already force; not a recommendation.','RC inference: locate the lines, then ask "what follows if this is true?" Reject anything requiring outside knowledge.','Extreme language ("never", "always", "no role") is a red flag unless the passage is equally extreme.']},
 {skill:'v_st',sec:'V',title:'Identify stated idea (RC detail and main idea)',items:['Map the passage: one phrase per paragraph stating its job (raises view, rejects it, offers alternative, addresses objection).','Main idea = the whole map, not the most interesting paragraph. Eliminate answers that are too narrow or misstate the author\'s stance.','Detail questions: find the exact lines and match meaning, not wording. Correct answers paraphrase; traps reuse words.','Function questions ("in order to"): describe the role in the argument, not the content.','Budget: 3 to 4 minutes reading, then about 1 minute per question. Read for structure, not memory.']},
 {skill:'di_ds',sec:'DI',title:'Data sufficiency',items:['Rephrase the question before touching the statements. "Is x > 5?" with x^2 in play means think about negatives.','AD / BCE grid: test (1) alone. If sufficient, answer is A or D; if not, B, C, or E. Then test (2) alone. Only combine if both fail alone.','Never solve completely. Ask only: does this pin down one value (or one yes/no)?','Two equations may be the same line (E). Check independence.','Use the stem\'s constraints (positive, integer) inside each statement.','Value questions: "sufficient" means exactly one value. Yes/no questions: a definite NO is also sufficient.']},
 {skill:'di_gt',sec:'DI',title:'Graphs and tables',items:['Read titles, axes, units, and footnotes before the question. Most misses are unit misses (thousands vs units, percent vs points).','Percent change vs absolute change: the largest bar is not the largest percent.','Sort mentally for medians; compute means only when asked.','Estimate first; choices are usually spread enough that rough arithmetic suffices. Use the calculator only for the final step.']},
 {skill:'di_msr',sec:'DI',title:'Multi-source reasoning',items:['Skim each tab for what it contains (rules vs data vs narrative). Do not read everything up front.','Answer-driven reading: go back to the tab that holds the relevant rule and check each condition in order.','List conditions as a checklist and test each request against all of them; the trap is stopping at the first satisfied rule.']},
 {skill:'di_tpa',sec:'DI',title:'Two-part analysis',items:['Decide if the two parts are independent or linked. Linked parts are one system of equations; solve once, place both answers.','The same value may be correct for both columns; do not assume they must differ.','Confirm both selections against the stem before submitting; a half-right TPA scores zero.']},
 {skill:'pacing',sec:'G',title:'Pacing and review-and-edit',items:['Section pace: Quant 2:08 per question, Verbal 1:57, DI 2:15. Check the clock every 5 questions.','Bail rule: if you have no method after 60 to 75 seconds, choose the best remaining option and bookmark it.','Focus Edition lets you bookmark and change up to 3 answers per section. Reserve 3 to 5 minutes at the end for that pass; do not re-solve from scratch.','Your Dec 2025 pattern: 5 of 6 Quant misses were slow-and-wrong. Time cost more than concepts on those. Practice letting go.']}

 const plans=[['Monthly','$19.99','billed monthly'],['Quarterly','$44.99','$15.00/mo, billed every 3 months'],['Annual','$119.99','$10.00/mo, billed annually']];
 el.innerHTML='<div class="narrow stack"><div><h1 style="font-size:var(--text-xl)">Account</h1><p class="muted" style="margin:6px 0 0">Profile, study program, plan, and your data.</p></div>'+
 '<div class="card stack-4"><div class="card-title">Sign in and sync</div>'+auth+'</div>'+
 '<div class="card stack-4"><div class="card-title">Profile</div><div class="row"><label class="small">Name <input type="text" value="'+esc(s.name||'')+'" onchange="state.settings.name=this.value;persist();updateHeader()"></label><label class="small">Test date <input type="date" value="'+esc(s.testDate||'')+'" onchange="state.settings.testDate=this.value;persist()"></label><label class="small">Daily goal <select onchange="state.settings.dailyGoal=+this.value;persist()">'+[10,15,20,30,40].map(d=>'<option '+(s.dailyGoal===d?'selected':'')+'>'+d+'</option>').join('')+'</select></label></div></div>'+
 '<div class="card stack-4"><div class="card-head" style="margin:0"><span class="card-title">Study program</span>'+badge(pr.exam,'sec-Q')+'</div><table><tbody><tr><td style="width:160px">Exam</td><td>'+esc(pr.exam)+' <span class="small">(GRE, LSAT, MCAT, Executive Assessment coming)</span></td></tr><tr><td>Goal</td><td><input type="text" style="width:100%" value="'+esc(pr.goal||'')+'" placeholder="e.g. Score 675+ for M7 programs" onchange="state.settings.program.goal=this.value;persist()"></td></tr><tr><td>Time</td><td><select onchange="state.settings.program.hours=this.value;persist()">'+['1 to 3 hrs / week','3 to 5 hrs / week','5 to 10 hrs / week','10+ hrs / week'].map(h=>'<option '+(pr.hours===h?'selected':'')+'>'+h+'</option>').join('')+'</select></td></tr><tr><td>Tools</td><td class="chips">'+['Quick 10','Timed sprint','Flashcards','Custom drill'].map(tl=>'<span class="chip-t '+(pr.tools[tl]?'on':'')+'" onclick="state.settings.program.tools[\''+tl+'\']=!state.settings.program.tools[\''+tl+'\'];persist();renderData()">'+tl+'</span>').join('')+'</td></tr></tbody></table><div><button class="btn secondary sm" onclick="startOnboarding()">Re-run the setup wizard</button></div></div>'+
 '<div class="card stack-4"><div class="card-head" style="margin:0"><span class="card-title">Plan and billing</span>'+badge('Free plan','accent')+'</div><p class="small" style="margin:0">Free while we build. Paid plans unlock Meridian Assist coaching, generated practice, and the weekly digest. Payments will run through Stripe Checkout; we never see your card.</p><div class="tiles" style="grid-template-columns:repeat(3,1fr)">'+plans.map(p=>'<div class="tile"><div class="l">'+p[0]+'</div><div class="v" style="font-size:24px">'+p[1]+'</div><div class="small">'+p[2]+'</div><button class="btn secondary sm" style="margin-top:10px" disabled>Coming soon</button></div>').join('')+'</div></div>'+
 '<div class="card stack-4"><div class="card-title">Notifications</div><label class="row" style="gap:8px;cursor:pointer"><input type="checkbox" '+(s.digest?'checked':'')+' onchange="state.settings.digest=this.checked;persist()"> Weekly progress digest by email (when accounts launch)</label></div>'+
 '<div class="card stack-4"><div class="card-title">Privacy and data</div><p class="small" style="margin:0">Your answers, ratings and settings. Download everything as JSON, restore from a file, or delete it. Deleting removes your data from this device'+(signed?' and from your account':'')+'.</p><div class="row"><button class="btn" onclick="exportState()">Download my data</button><label class="btn secondary">Import from file <input type="file" accept="application/json" onchange="importState(this)"></label><button class="btn ghost" onclick="deleteEverything()">Delete my data</button></div><table><tbody><tr><td>Attempts</td><td class="num">'+state.attempts.length+'</td></tr><tr><td>Sessions</td><td class="num">'+state.sessions.length+'</td></tr><tr><td>Events logged</td><td class="num">'+((state.events||[]).length)+'</td></tr><tr><td>Created</td><td>'+new Date(state.created).toLocaleString()+'</td></tr><tr><td>Bank</td><td class="num">'+BANK.length+' items · app '+APP_VERSION+'</td></tr></tbody></table></div></div>'; }
async function sendMagicLink(){ const em=(document.getElementById('authEmail').value||'').trim(); if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ toast('Enter a valid email.'); return; } state.settings.email=em; persist(); const {error}=await Cloud.signIn(em); const m=document.getElementById('authMsg'); if(error){ m.textContent='Could not send: '+error.message; } else { m.textContent='Check your inbox for the sign-in link. Open it on this device to sync here.'; } }
async function deleteEverything(){ if(!confirm('Delete all progress'+(Cloud.user?' from this device and your account':'')+'? Download first if you want a copy.')) return; if(Cloud.user){ await Cloud.wipe(); track('account_deleted',{}); } const st=state.settings; state=newState(); state.settings=Object.assign(state.settings,{name:st.name,onboarded:true}); Store.clear(); Store.save(state); renderData(); updateHeader(); toast('Deleted.'); }
function exportState(){ const blob=new Blob([JSON.stringify(state)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='meridian-progress-'+new Date().toISOString().slice(0,10)+'.json'; a.click(); }
function importState(inp){ const f=inp.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const s=JSON.parse(r.result); if(!s.skills||!s.attempts) throw 0; state=s; SKILLS.forEach(k=>{ if(!state.skills[k.id]) state.skills[k.id]={r:START_R,n:0,c:0,t:0,hist:[]}; }); if(!state.seen) state.seen={}; if(!state.settings) state.settings={name:'Hunter',testDate:'',dailyGoal:20}; if(state.settings.onboarded===undefined) state.settings.onboarded=false; if(!state.settings.program) state.settings.program={exam:'GMAT',goal:'',hours:'3 to 5 hrs / week',tools:{'Quick 10':true,'Timed sprint':true,'Flashcards':false}}; if(state.settings.digest===undefined) state.settings.digest=true; persist(); toast('Imported '+state.attempts.length+' attempts.'); renderData(); updateHeader(); }catch(e){ toast('That file is not a valid progress export.'); } }; r.readAsText(f); }
// keyboard: 1-5 select, Enter submit/next
document.addEventListener('keydown',e=>{ if(!session||document.getElementById('v-study').classList.contains('hidden')) return; const tag=(e.target.tagName||'').toLowerCase(); if(tag==='input'||tag==='textarea'||tag==='select') return; if(/^[1-5]$/.test(e.key)&&!session.answered){ const i=+e.key-1; if(document.getElementById('opt'+i)) selectChoice(i); } if(e.key==='Enter'){ e.preventDefault(); if(!session.answered) submitAnswer(); else nextQuestion(); } });

function startOnboarding(){ ob.step=0; ob.goal=state.settings.program.goal||''; renderOnboarding(); }
function renderOnboarding(){ let w=document.getElementById('onb'); if(!w){ w=document.createElement('div'); w.id='onb'; document.body.appendChild(w); } const steps=['Exam','Goal','Time','Tools']; let body='';
 if(ob.step===0) body='<h2>Which exam are you preparing for?</h2><p class="muted">Every later surface (sections, score model, rounds) keys off this choice.</p><div class="chips" style="gap:10px">'+OB_EXAMS.map(e=>'<span class="chip-t '+(ob.exam===e[0]?'on':'')+'" style="padding:9px 18px;font-size:14px;'+(e[2]?'':'opacity:.5;cursor:not-allowed')+'" '+(e[2]?'onclick="ob.exam=\''+e[0]+'\';renderOnboarding()"':'')+'>'+e[0]+' <span class="small" style="'+(ob.exam===e[0]?'color:#cdd5e3':'')+'">'+e[1]+'</span></span>').join('')+'</div>';
 if(ob.step===1) body='<h2>What are you aiming for?</h2><p class="muted">One line. It shows on your dashboard and shapes the plan.</p><input type="text" id="obGoal" style="width:100%;font-size:16px;padding:10px 12px" placeholder="e.g. Score 675+ for M7 programs" value="'+esc(ob.goal)+'" oninput="ob.goal=this.value"><div class="small" style="margin:12px 0 6px;font-weight:600">Suggestions from students with similar goals</div><div class="chips">'+OB_GOALS.map(g=>'<span class="chip-t" onclick="ob.goal=\''+g.replace(/'/g,'')+'\';renderOnboarding()">'+g+'</span>').join('')+'</div>';
 if(ob.step===2) body='<h2>How much time can you give it?</h2><p class="muted">We size the daily plan to fit.</p><div class="chips" style="gap:10px">'+['1 to 3 hrs / week','3 to 5 hrs / week','5 to 10 hrs / week','10+ hrs / week'].map(h=>'<span class="chip-t '+(ob.hours===h?'on':'')+'" style="padding:9px 18px;font-size:14px" onclick="ob.hours=\''+h+'\';renderOnboarding()">'+h+'</span>').join('')+'</div>';
 if(ob.step===3) body='<h2>Recommended tools</h2><p class="muted">Pre-selected for '+esc(ob.exam)+'. Toggle anything.</p><div class="stack-4" style="gap:10px">'+[['Quick 10','Adaptive daily rounds, the core loop'],['Timed sprint','Pace training at section speed'],['Flashcards','Formula and method recall'],['Custom drill','Targeted sets by skill and difficulty']].map(t=>'<label class="plan-row" style="cursor:pointer"><input type="checkbox" '+(ob.tools[t[0]]?'checked':'')+' onchange="ob.tools[\''+t[0]+'\']=this.checked"><span class="t">'+t[0]+'</span><span class="small">'+t[1]+'</span></label>').join('')+'</div>';
 w.innerHTML='<div class="onb-scrim"><div class="onb-card"><div class="row" style="justify-content:space-between;margin-bottom:18px"><span class="wordmark" style="font-size:17px"><svg viewBox="0 0 48 48" width="24" height="24" aria-hidden="true"><path d="M24 2 44 13v22L24 46 4 35V13Z" fill="#122B4E"/><path d="M24 5.5 41 14.8v18.4L24 42.5 7 33.2V14.8Z" fill="none" stroke="#C7A252" stroke-width="1.5"/><path d="m15.5 25 6.5 6.5L33 17.5" fill="none" stroke="#C7A252" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Meridian <b>Prep</b></span><button class="btn ghost sm" onclick="finishOnboarding(true)">Skip to dashboard</button></div><div class="row" style="gap:6px;margin-bottom:22px">'+steps.map((s,i)=>'<span class="badge '+(i===ob.step?'accent':i<ob.step?'success':'')+'">'+(i+1)+' '+s+'</span>').join('')+'</div>'+body+'<div class="row" style="justify-content:space-between;margin-top:26px"><button class="btn secondary" '+(ob.step===0?'disabled':'')+' onclick="ob.step--;renderOnboarding()">Back</button><button class="btn" onclick="'+(ob.step<3?'ob.step++;renderOnboarding()':'finishOnboarding(false)')+'">'+(ob.step<3?'Continue':'Start studying')+'</button></div></div></div>'; }
function finishOnboarding(skipped){ if(!skipped){ state.settings.program={exam:ob.exam,goal:ob.goal,hours:ob.hours,tools:ob.tools}; track('wizard_completed',{exam:ob.exam,goal_len:ob.goal.length,hours:ob.hours}); } state.settings.onboarded=true; persist(); const w=document.getElementById('onb'); if(w) w.remove(); renderDash(); }
